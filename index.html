<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>作品集 · 我的作品都在这里（离线版）</title>
<style>:root{--bg:#FBF3E7;--card:#FFFFFF;--line:#F0E1CC;--ink:#233047;--ink-soft:#8A8172;--accent:#F0561D;--accent-deep:#D8450F;--amber:#F5A623;--peach:#FCE4CE;--shadow:0 14px 34px -18px rgba(190,120,50,.28);--radius:22px;--grid-gap:22px;--card-min:280px}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle 320px at 92% 6%,rgba(252,190,140,.35),transparent 70%),radial-gradient(circle 260px at 4% 30%,rgba(250,205,165,.30),transparent 70%),radial-gradient(circle 300px at 85% 75%,rgba(252,214,175,.25),transparent 70%)}a{color:inherit;text-decoration:none}.wrap{max-width:1120px;margin:0 auto;padding:0 22px;position:relative;z-index:1}header.nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);background:rgba(251,243,231,.85);border-bottom:1px solid var(--line)}.nav-inner{display:flex;align-items:center;justify-content:space-between;height:64px;gap:14px}.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}.logo .gem{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:14px;box-shadow:0 6px 14px -6px rgba(240,86,29,.5)}.logo small{display:block;font-size:10px;color:var(--ink-soft);font-weight:600;letter-spacing:2px;line-height:1.1}.nav-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:0 4px 10px -6px rgba(190,120,50,.25)}.seg button{border:0;background:transparent;font:inherit;font-size:12px;font-weight:700;color:var(--ink-soft);padding:5px 13px;border-radius:999px;cursor:pointer;transition:background .18s,color .18s;white-space:nowrap}.seg button.on{background:var(--accent);color:#fff}.hero{margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:44px 46px;display:flex;align-items:center;gap:30px;overflow:hidden;position:relative}.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:200px;height:200px;border-radius:50%;background:var(--peach);opacity:.6;pointer-events:none}.hero-main{flex:1;position:relative;z-index:1}.badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--accent-deep);border:1.5px solid rgba(240,86,29,.45);background:#FFF6ED;border-radius:999px;padding:6px 14px}.badge .b-ic{width:16px;height:16px;border-radius:5px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:10px}.hero h1{font-size:clamp(30px,4.6vw,46px);font-weight:900;line-height:1.22;margin:18px 0 12px;letter-spacing:.5px}.hero h1 .hl{color:var(--accent)}.hero .desc{color:#6E675B;font-size:15px;max-width:520px}.hero .desc b{color:var(--ink)}.hero .desc .mark{background:linear-gradient(transparent 60%,rgba(245,166,35,.45) 60%);font-weight:700;color:var(--ink)}.stat-line{margin-top:22px;display:inline-flex;align-items:center;gap:10px;background:#FFF6ED;border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-size:14px;color:#6E675B}.stat-line .num{min-width:26px;height:26px;border-radius:8px;background:var(--ink);color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px;padding:0 6px}.stat-line b{color:var(--ink)}.hero-art{flex:0 0 230px;position:relative;z-index:1}.hero-art svg{width:100%;height:auto;display:block}@media(max-width:860px){.hero{flex-direction:column;padding:34px 26px;align-items:flex-start}.hero-art{flex:none;width:200px;align-self:center}}.sec-title{display:flex;align-items:baseline;gap:12px;margin:44px 0 20px;flex-wrap:wrap}.sec-title h2{font-size:22px;font-weight:900;letter-spacing:.5px}.sec-title .en{font-size:12px;color:var(--ink-soft);letter-spacing:2px;font-weight:600}.sec-title .count{margin-left:auto;font-size:12.5px;color:var(--ink-soft);font-weight:600}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--grid-gap)}.grid.compact{grid-template-columns:repeat(auto-fill,minmax(var(--card-min),1fr))}.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 12px 18px;overflow:hidden;cursor:pointer;transition:transform .22s,box-shadow .22s;box-shadow:0 8px 20px -14px rgba(190,120,50,.22)}.card:hover{transform:translateY(-6px);box-shadow:0 22px 40px -18px rgba(190,120,50,.38)}.card .cover{aspect-ratio:16/10;border-radius:14px;overflow:hidden;position:relative;background:linear-gradient(135deg,#FFE8CF,#FFD9B8)}.card .cover img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}.card .ph{width:100%;height:100%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:42px;background:linear-gradient(135deg,var(--accent),var(--amber))}.card .avatar{position:absolute;right:10px;bottom:10px;z-index:2;width:44px;height:44px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;color:#fff;font-weight:900;font-size:17px;background:linear-gradient(135deg,var(--ink),#4A5B7C);box-shadow:0 6px 14px -6px rgba(35,48,71,.5)}.card .copy{position:absolute;top:10px;right:10px;z-index:3;width:34px;height:34px;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.92);color:#6E675B;border-radius:10px;cursor:pointer;display:grid;place-items:center;transition:color .2s}.card .copy:hover{color:var(--accent)}.card .copy svg{width:16px;height:16px}.card .body{padding:14px 6px 0;position:relative;z-index:0}.card .name{font-weight:800;font-size:17px;color:var(--ink)}.card .go{margin-top:12px;font-size:13px;font-weight:700;color:var(--accent);display:inline-flex;align-items:center;gap:6px}.card .card-hit{position:absolute;inset:0;z-index:1;display:block}@media(max-width:520px){.card .copy{width:40px;height:40px}}.list{display:none;flex-direction:column;gap:12px}.list.on{display:flex}.grid.off{display:none}.row{display:grid;grid-template-columns:168px 1fr auto;gap:18px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 18px 12px 12px;transition:transform .18s,box-shadow .18s;box-shadow:0 8px 20px -16px rgba(190,120,50,.22)}.row:hover{transform:translateX(3px);box-shadow:0 16px 30px -18px rgba(190,120,50,.34)}.row .thumb{aspect-ratio:16/10;border-radius:11px;overflow:hidden;background:linear-gradient(135deg,#FFE8CF,#FFD9B8)}.row .thumb img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}.row .n{font-weight:800;font-size:16px;color:var(--ink)}.row .u{font-size:12.5px;color:var(--ink-soft);margin-top:3px;word-break:break-all}.row .acts{display:flex;gap:8px}.mini{border:1px solid var(--line);background:#FFFBF4;color:var(--accent-deep);font:inherit;font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;transition:background .18s,border-color .18s}.mini:hover{background:#FFF1E3;border-color:#F3D6B6}.mini.solid{background:var(--accent);color:#fff;border-color:var(--accent)}.mini.solid:hover{background:var(--accent-deep);border-color:var(--accent-deep)}@media(max-width:700px){.row{grid-template-columns:1fr;gap:12px}.row .thumb{aspect-ratio:16/9}}.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);z-index:80;background:#2B2B33;border:1px solid rgba(255,255,255,.15);color:#FFF6ED;padding:12px 22px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .3s,transform .3s;box-shadow:0 16px 34px -14px rgba(0,0,0,.4);max-width:88vw}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.err{background:#7C2D12}.tail{height:44px}@media print{header.nav,.seg,.card .copy,.card .avatar,.tail{display:none!important}body::before{display:none}.card,.hero{box-shadow:none}}</style>
</head>
<body>
<header class="nav">
<div class="wrap nav-inner">

<main class="wrap">

 <h1>想看我的作品？<br><span class="hl">都在这一面墙上。</span></h1>

<div class="toast" id="toast"></div>
<script>var WORKS=[{name:"库存推演工具",url:"works/01-%E5%BA%93%E5%AD%98%E6%8E%A8%E6%BC%94%E5%B7%A5%E5%85%B7.html",cover:"c1"},{name:"全链条库存",url:"works/02-%E5%85%A8%E9%93%BE%E6%9D%A1%E5%BA%93%E5%AD%98%E6%8E%A8%E6%BC%94.html",cover:"c2"},{name:"物流策略",url:"works/03-%E7%89%A9%E6%B5%81%E7%AD%96%E7%95%A5.html",cover:"c3"},{name:"智能补货系统",url:"works/04-%E6%99%BA%E8%83%BD%E8%A1%A5%E8%B4%A7%E7%B3%BB%E7%BB%9F.html",cover:"c4"},{name:"跨境独立站建站",url:"works/05-%E8%B7%A8%E5%A2%83%E7%8B%AC%E7%AB%8B%E7%AB%99%E5%BB%BA%E7%AB%99.html",cover:"c5"}];var STAMP='2026-09-18 18:04';var COVERS={"c1":"assets/covers/cover-c1.webp","c2":"assets/covers/cover-c2.webp","c3":"assets/covers/cover-c3.webp","c4":"assets/covers/cover-c4.webp","c5":"assets/covers/cover-c5.webp"};(function(){var grid=document.getElementById('grid');var list=document.getElementById('list');var countEl=document.getElementById('count');var countWord=document.getElementById('countWord');var stampEl=document.getElementById('stamp');var descEl=document.getElementById('desc');function isLocal(u){return!!u&&!/^(?:https?:)?\/\//i.test(u)&&!/^mailto:/i.test(u);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function coverSrc(key){if(!key)return null;if(/^https?:/.test(key))return key;return COVERS[key]||null;}
function showToast(msg,isErr){var t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(isErr?' err':'');clearTimeout(showToast._t);showToast._t=setTimeout(function(){t.className='toast'+(isErr?' err':'');},2400);}
function copyText(u){if(!u){showToast('该作品暂无链接');return;}
var done=function(){showToast('链接已复制，去浏览器打开即可');};var fail=function(){showToast('复制失败，链接：'+u,true);};if(navigator.clipboard&&navigator.clipboard.writeText&&location.protocol!=='file:'){navigator.clipboard.writeText(u).then(done,function(){fallbackCopy(u,done,fail);});}else{fallbackCopy(u,done,fail);}}
function fallbackCopy(u,done,fail){try{var ta=document.createElement('textarea');ta.value=u;ta.style.position='fixed';ta.style.top='-9999px';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');document.body.removeChild(ta);done();}catch(e){fail();}}
var HTML_COPY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg>';function cardHTML(w){var src=coverSrc(w.cover);var initial=esc(String(w.name||'未命名').charAt(0));var local=isLocal(w.url);var coverHtml=src?'<img src="'+esc(src)+'" alt="'+esc(w.name)+'" loading="lazy"/>':'<div class="ph">'+initial+'</div>';var copyBtn=local?'':'<button class="copy" type="button" data-url="'+esc(w.url)+'" title="复制链接" aria-label="复制链接">'+HTML_COPY+'</button>';return'<div class="card" data-url="'+esc(w.url)+'">'
+'<a class="card-hit" href="'+esc(w.url||'#')+'" target="_blank" rel="noopener noreferrer" aria-label="'+esc(w.name)+'"></a>'
+'<div class="cover">'+coverHtml
+'<span class="avatar">'+initial+'</span>'
+'</div>'
+copyBtn
+'<div class="body"><div class="name">'+esc(w.name)+'</div>'
+'<div class="go">'+(local?'打开本地页面':'访问作品')+' &rarr;</div></div></div>';}
function rowHTML(w){var src=coverSrc(w.cover);var initial=esc(String(w.name||'未命名').charAt(0));var local=isLocal(w.url);var thumb=src?'<img src="'+esc(src)+'" alt="'+esc(w.name)+'" loading="lazy"/>':'<div class="ph" style="font-size:26px">'+initial+'</div>';var copyBtn=local?'':'<button class="mini" type="button" data-copy="'+esc(w.url)+'">复制链接</button>';return'<div class="row">'
+'<div class="thumb">'+thumb+'</div>'
+'<div><div class="n">'+esc(w.name)+'</div><div class="u">'+esc(w.url||'（暂无链接）')+(local?'　<span style="color:#D8450F;font-weight:700">· 本地</span>':'')+'</div></div>'
+'<div class="acts">'
+copyBtn
+'<button class="mini solid" type="button" data-open="'+esc(w.url)+'">'+(local?'打开本地页面':'打开作品')+'</button>'
+'</div></div>';}
function go(url){if(!url){showToast('该作品暂无链接');return;}
window.open(url,'_blank','noopener,noreferrer');}
function render(){var allLocal=WORKS.length>0&&WORKS.every(function(w){return isLocal(w.url);});countEl.textContent=WORKS.length;countWord.textContent=WORKS.length+' 个作品已上架';stampEl.textContent='快照 '+STAMP+' · 共 '+WORKS.length+' 件';if(descEl){descEl.innerHTML=allLocal?'每一件作品<b>点开即达</b>，<span class="mark">作品页和封面都已打包在本地</span>——断网、换机器都能完整翻看，全程不联网。<br><b>作品均为基于作者业务认知加 AI 虚构的项目。</b>':'每一件作品<b>点开即达</b>，封面、名字、链接都已固化在本地——断网也能翻，<span class="mark">封面不依赖任何外链</span>。<br><b>作品均为基于作者业务认知加 AI 虚构的项目。</b>';}
grid.innerHTML=WORKS.map(cardHTML).join('');list.innerHTML=WORKS.map(rowHTML).join('');}
document.addEventListener('click',function(e){var t=e.target;var copyBtn=t.closest?t.closest('.copy'):null;if(copyBtn){e.preventDefault();e.stopPropagation();copyText(copyBtn.getAttribute('data-url'));return;}
var cBtn=t.closest?t.closest('[data-copy]'):null;if(cBtn){copyText(cBtn.getAttribute('data-copy'));return;}
var oBtn=t.closest?t.closest('[data-open]'):null;if(oBtn){go(oBtn.getAttribute('data-open'));return;}});document.getElementById('seg').addEventListener('click',function(e){var b=e.target.closest?e.target.closest('button[data-v]'):null;if(!b)return;var v=b.getAttribute('data-v');Array.prototype.forEach.call(this.querySelectorAll('button'),function(x){x.classList.toggle('on',x===b);});grid.classList.toggle('off',v!=='grid');list.classList.toggle('on',v==='list');});render();})();</script>
