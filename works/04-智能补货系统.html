/* =====================================================================
   11.6 渠道预测 / 总预测汇总（销量预测 SRS 第4、5章）
   ===================================================================== */
const whsOfShop = shop => WAREHOUSES.filter(w => whShop[w.code] === shop).map(w => w.code);
const metaOfWh  = code => SHOPS.find(x => x.code === whShop[code]) || { ch:'其他', country:'其他' };

/* 提交状态推进序（销量预测 SRS 4.2.2）：待提交 → 已提交 → 已锁定（月底自动锁定） */
const STATUS_RANK  = { '待提交':0, '已提交':1, '已锁定':2 };
const STATUS_LABEL = ['待提交', '已提交', '已锁定'];
/* 汇总态取各店铺中「最靠前」的状态：只要还有店铺未提交，该行即为待提交 */
function rollupStatus(list) {
  if (!list.length) return '待提交';
  return STATUS_LABEL[Math.min.apply(null, list.map(s => STATUS_RANK[s] === undefined ? 0 : STATUS_RANK[s]))];
}
/* 是否已完成提交（含已锁定 —— 锁定是提交之后的后续状态） */
function isSubmitted(s) { return (STATUS_RANK[s] || 0) >= 1; }

/* 渠道维度汇总：渠道 + 国家 + SKU + 预测周（销量预测 SRS 第4章 4.1.3）
   渠道预测值 = Σ 各店铺该渠道预测值；各店铺预测值 = 历史趋势预测 + 业务调整值 */
function channelRows(limitWeeks) {
  const g = {};
  FORECAST.filter(r => r.w < limitWeeks).forEach(r => {
    const m = metaOfWh(r.wh);
    const key = m.ch + '|' + m.country + '|' + r.sku + '|' + r.week;
    if (!g[key]) g[key] = { key, ch:m.ch, country:m.country, sku:r.sku, week:r.week, w:r.w,
      shopStatus:{}, trend:0, adj:0 };
    const o = g[key], shop = whShop[r.wh];
    /* 同一店铺可能挂多个仓库，取最保守（最靠前）的状态 */
    const prev = o.shopStatus[shop];
    o.shopStatus[shop] = (!prev || STATUS_RANK[r.status] < STATUS_RANK[prev]) ? r.status : prev;
    o.trend += r.ai; o.adj += r.adj;
  });
  return Object.keys(g).map(k => {
    const o = g[k];
    const sts = Object.keys(o.shopStatus).map(s => o.shopStatus[s]);
    o.shopCount = sts.length;
    o.value = o.trend + o.adj;
    o.status = rollupStatus(sts);
    return o;
  }).sort((a, b) => (a.w - b.w) || a.sku.localeCompare(b.sku));
}

/* SKU 维度总预测汇总：SKU + 预测周（销量预测 SRS 第5章 5.1.1）
   总销量预测(SKU) = Σ 各店铺预测值(SKU) */
function summaryRows(limitWeeks) {
  const g = {};
  FORECAST.filter(r => r.w < limitWeeks).forEach(r => {
    const m = metaOfWh(r.wh), shop = whShop[r.wh];
    const key = r.sku + '|' + r.week;
    if (!g[key]) g[key] = { key, sku:r.sku, week:r.week, w:r.w, chs:{}, countries:{},
      shops:{}, pend:{}, trend:0, adj:0 };
    const o = g[key];
    o.chs[m.ch] = true; o.countries[m.country] = true; o.shops[shop] = true;
    o.trend += r.ai; o.adj += r.adj;
    if (!isSubmitted(r.status)) o.pend[shop] = true;
  });
  return Object.keys(g).map(k => {
    const o = g[k];
    o.chCount   = Object.keys(o.chs).length;
    o.ctCount   = Object.keys(o.countries).length;
    o.shopCount = Object.keys(o.shops).length;
    o.pendingShops = Object.keys(o.pend).length;
    o.audited   = o.shopCount - o.pendingShops;
    o.total     = o.trend + o.adj;
    o.status    = STATE.sumDone[o.key] ? '已汇总' : '待汇总';
    return o;
  }).sort((a, b) => (a.w - b.w) || a.sku.localeCompare(b.sku));
}

    kpiCard({ label:'历史趋势预测合计', value: nf(trendSum), unit:'件', foot:'第一层输出，只读' }) +
    kpiCard({ label:'业务调整合计', value: (adjSum > 0 ? '+' : '') + nf(adjSum), unit:'件', foot:'第二层运营录入', tone: adjSum >= 0 ? 'k-good' : 'k-warn' }) +

  '</div>' +

  '<div class="card"><div class="filter-bar">' +
    '<div class="field"><label>渠道</label><select class="sel" id="f-ch-ch"><option value="">全部</option>' +
      Array.from(new Set(SHOPS.map(s => s.ch))).map(o => '<option' + (f.ch === o ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select></div>' +
    '<div class="field"><label>国家</label><select class="sel" id="f-ch-country"><option value="">全部</option>' +

function channelDetail(key) {
  const r = channelRows(20).find(x => x.key === key);
  if (!r) return;
  const shops = Object.keys(r.shopStatus);
  const trendAll = shops.reduce((acc, shop) => {
    const whs = whsOfShop(shop);
    return acc + FORECAST.filter(x => whs.indexOf(x.wh) >= 0 && x.sku === r.sku && x.week === r.week)
      .reduce((a, b) => a + b.ai, 0);
  }, 0);
  const body = shops.map(shop => {
    const whs = whsOfShop(shop);
    const cells = FORECAST.filter(x => whs.indexOf(x.wh) >= 0 && x.sku === r.sku && x.week === r.week);
    const trend = cells.reduce((a, b) => a + b.ai, 0);
    const adj   = cells.reduce((a, b) => a + b.adj, 0);
    return '<tr><td>' + esc(shop) + '</td><td class="num">' + nf(trend) + '</td>' +
      '<td class="num">' + (adj > 0 ? '+' : '') + nf(adj) + '</td>' +
      '<td class="num strong">' + nf(trend + adj) + '</td>' +
      '<td>' + st(r.shopStatus[shop]) + '</td></tr>';
  }).join('');
  openModal({
    title: '渠道预测明细 · ' + r.ch + ' / ' + r.country + ' / ' + r.sku + ' / ' + r.week, wide: true,
    body: '<div class="notice">' + icon('info', 'width:15px;height:15px') +
      '<div>展开该渠道下各店铺的预测明细。<b>渠道预测值</b>为各店铺「历史趋势预测 + 业务调整值」的汇总，' +
      '当前汇总值 <b>' + nf(r.value) + '</b> 件（各店铺历史趋势合计 ' + nf(trendAll) + ' 件）。</div></div>' +

      '</tr></thead><tbody>' + body + '</tbody></table></div>',

/* 预测状态记录（销量预测 SRS 4.4.1）：生成 / 修改 / 提交 / 撤回 / 锁定 */
function channelLog(key) {
  const r = channelRows(20).find(x => x.key === key);
  if (!r) return;
  const shops = Object.keys(r.shopStatus);
  const rows = [];
  shops.forEach((shop, i) => {
    const stt = r.shopStatus[shop];
    const base = addDays(TODAY, -rint(2, 9));
    rows.push({ t: fmtDate(base) + ' 02:00', who: '系统', shop, op:'生成', after: Math.round(r.trend / shops.length), reason:'模型自动生成第一层预测' });
    if (r.adj !== 0) rows.push({ t: fmtDate(addDays(base, 1)) + ' 1' + rint(0, 8) + ':' + String(rint(10, 59)).padStart(2, '0'),
      who: pick(['张明', '李思远', '王倩']), shop, op:'修改',
      before: Math.round(r.trend / shops.length), after: Math.round(r.trend / shops.length) + Math.round(r.adj / shops.length),
      reason: '录入第二层业务调整' });
    if (STATUS_RANK[stt] >= 1) rows.push({ t: fmtDate(addDays(base, 2)) + ' 1' + rint(0, 8) + ':' + String(rint(10, 59)).padStart(2, '0'),
      who: pick(['张明', '李思远', '王倩']), shop, op:'提交', after: r.value, reason: '每月 1 号提交本月预测' });
    if (STATUS_RANK[stt] >= 2) rows.push({ t: fmtDate(addDays(base, 6)) + ' 23:59', who: '系统', shop, op:'锁定', after: r.value, reason: '月底自动锁定，不可修改' });
  });
  rows.sort((a, b) => b.t.localeCompare(a.t));
  openModal({
    title: '预测状态记录 · ' + r.ch + ' / ' + r.country + ' / ' + r.sku + ' / ' + r.week, wide: true,
    body: '<div class="notice">' + icon('info', 'width:15px;height:15px') +
      '<div>完整记录该条预测的操作轨迹（SRS 4.4.1）：操作人 / 操作时间 / 操作类型 / 操作前值 / 操作后值 / 调整原因。</div></div>' +
      '<div class="table-wrap"><table class="tbl"><thead><tr><th>操作时间</th><th>操作人</th><th>店铺</th><th>操作类型</th>' +
      '<th class="num">操作前值</th><th class="num">操作后值</th><th>调整原因</th></tr></thead><tbody>' +
      (rows.length ? rows.map(x =>
        '<tr><td class="mono inline-note">' + esc(x.t) + '</td><td>' + esc(x.who) + '</td><td>' + esc(x.shop) + '</td>' +
        '<td>' + badge(x.op, x.op === '生成' ? 'blue' : x.op === '修改' ? 'orange' : x.op === '提交' ? 'green' : 'gray') + '</td>' +
        '<td class="num inline-note">' + (x.before === undefined ? '—' : nf(x.before)) + '</td>' +
        '<td class="num">' + nf(x.after) + '</td>' +
        '<td class="inline-note">' + esc(x.reason) + '</td></tr>').join('') : emptyRow(7, '暂无操作记录')) +
      '</tbody></table></div>',
    foot: '<button class="btn primary" data-close="1">关闭</button>'
  });
}

/* 全局调整（销量预测 SRS 5.4）：按比例调整各渠道/店铺的预测分配后再汇总。
   调整量记入第二层「业务调整值」，不引入第三层，保持两层预测结构 */
function summaryGlobalModal() {
  const chOpts = Array.from(new Set(SHOPS.map(s => s.ch)));
  openModal({
    title: '全局调整 · 按渠道调整预测分配', narrow: true,
    body:
      '<div class="notice">' + icon('info', 'width:15px;height:15px') +
      '<div>对指定渠道的预测值按系数等比调整，调整量记入第二层「业务调整值」，汇总时一并计入总预测销量。</div></div>' +
      '<div class="form-grid">' +
        '<div class="field full"><label>渠道<span class="req">*</span></label>' +
          '<select class="sel" id="glCh">' + chOpts.map(c => '<option>' + esc(c) + '</option>').join('') + '</select></div>' +
        '<div class="field full"><label>调整系数（1.1 表示上调 10%）<span class="req">*</span></label>' +
          '<input class="inp" id="glCoef" type="number" step="0.05" value="1.1" /></div>' +
        '<div class="field full"><label>调整原因<span class="req">*</span></label>' +
          '<input class="inp" id="glReason" placeholder="如：旺季资源倾斜，加大美区投放" /></div>' +
      '</div>',
    foot: '<button class="btn" data-close="1">取消</button><button class="btn primary" id="glOk">确认调整</button>',
    onMount: () => {
      $('#glOk').onclick = () => {
        const ch = $('#glCh').value, coef = Number($('#glCoef').value), reason = $('#glReason').value.trim();
        if (!coef || coef <= 0) { toast('调整系数需大于 0', 'warn'); return; }
        if (!reason) { toast('调整原因为必填项', 'warn'); return; }
        let n = 0;
        FORECAST.forEach(r => {
          if (metaOfWh(r.wh).ch === ch) { r.adj += Math.round(r.ai * (coef - 1)); n++; }
        });
        pushLog('全局调整预测分配', '预测汇总', ch + ' 渠道', '系数 1.00', '系数 ' + coef, reason);
        closeModal();
        toast('已按系数 ' + coef + ' 调整「' + ch + '」渠道 ' + n + ' 条预测记录的业务调整值', 'ok');
        render();
      };
    }
  });
}

function dispatchSuggestion(sug) {
  const sku = skuBy(sug.sku);
  if (sug.mode === '采购') {
    const po = makePOFrom(sug);
    po.qty = sug.qtyFinal; po.inbound = 0; po.status = '待发货';
    po.orderDate = fmtDate(TODAY); po.source = '补货建议';
    PO_LIST.unshift(po);
    sug.dispatchTo = po.no;
    return { type:'采购订单', no: po.no, view:'po' };
  }
  const tf = makeTransferFrom(sug);
  tf.qty = sug.qtyFinal; tf.shipped = 0; tf.status = '待发货';
  tf.created = fmtDate(TODAY); tf.tracking = '已订舱';
  TRANSFER_LIST.unshift(tf);
  sug.dispatchTo = tf.no;
  return { type:'调拨单', no: tf.no, view:'transfer' };
}
function doReview(no, qty, opinion) {
  const sug = SUGGESTIONS.find(s => s.no === no);
  const old = sug.qtyFinal;
  sug.qtyFinal = qty;
  sug.opinion = opinion;
  sug.status = '已确认';
  const sku = skuBy(sug.sku);
  pushLog('审核补货建议', '补货审核', no, nf(old), nf(qty), opinion);
  const d = dispatchSuggestion(sug);
  sug.status = '已分发';
  /* 同步更新库存的在途量，体现「闭环回写」；total 为派生字段，需一并重算 */
  const inv = invOf(sug.sku, sug.wh);
  if (inv) {
    inv.inTransit += qty;
    inv.total = inv.qty + inv.inTransit + inv.inProduction;
  }
  return d;
}

  openModal({

document.addEventListener('click', e => {
  /* 菜单 */
  const grp = e.target.closest('.nav-group-title');
  if (grp) { const g = grp.dataset.group; STATE.expanded[g] = STATE.expanded[g] === false; render(); return; }
  const nav = e.target.closest('.nav-item');
  if (nav) { go(nav.dataset.route); return; }

  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  const fkeyOf = { 'sku-search':'sku','sku-reset':'sku','sup-search':'sup','sup-reset':'sup','wh-search':'wh','wh-reset':'wh',
    'fc-search':'fc','fc-reset':'fc','adj-search':'adj','adj-reset':'adj','safety-search':'safety','safety-reset':'safety',
    'channel-search':'channel','channel-reset':'channel','summary-search':'summary','summary-reset':'summary',
    'stock-search':'stock','stock-reset':'stock','stockAna-search':'stockAna','stockAna-reset':'stockAna',
    'stockAlert-search':'stockAlert','stockAlert-reset':'stockAlert',
    'sug-search':'sug','sug-reset':'sug','po-search':'po','po-reset':'po','tf-search':'tf','tf-reset':'tf',
    'usr-search':'usr','usr-reset':'usr','log-search':'log','log-reset':'log' };
  if (fkeyOf[act]) {
    const k = fkeyOf[act];
    if (act.indexOf('reset') >= 0) { STATE.filters[k] = {}; STATE.page[k] = 1; render(); }
    else applyFilter(k);
    return;
  }

  switch (act) {
    /* Dashboard */
    case 'export-dash': toast('日报已导出：供应链日报_20260916.xlsx', 'ok'); break;
    case 'go-sug': go('suggestion'); break;
    case 'go-adjust': go('adjust'); break;
    case 'quick-replenish':
      STATE.filters.sug = { name: t.dataset.sku }; STATE.page.sug = 1; go('suggestion');
      toast('已按 SKU ' + t.dataset.sku + ' 筛选补货建议', 'ok'); break;

    /* SKU */
    case 'sku-add': skuForm(null); break;
    case 'sku-edit': skuForm(skuBy(t.dataset.code)); break;
    case 'sku-del': {
      const s = skuBy(t.dataset.code);
      if (SUGGESTIONS.some(x => x.sku === s.code)) return toast('该 SKU 已被预测或补货数据引用，无法删除', 'err');
      confirmBox('删除确认', '确认删除 SKU【' + esc(s.name) + '】？删除后将无法恢复。', () => {
        SKUS.splice(SKUS.indexOf(s), 1); toast('删除成功', 'ok'); render();
      }, '确认删除');
      break;
    }
    case 'sku-import': importModal('SKU'); break;
    case 'sku-export': toast('已导出当前筛选结果 ' + SKUS.length + ' 条为 Excel', 'ok'); break;

    /* 供应商 */
    case 'sup-add': supForm(null); break;
    case 'sup-edit': supForm(SUPPLIERS.find(x => x.code === t.dataset.code)); break;
    case 'sup-del': {
      const s = SUPPLIERS.find(x => x.code === t.dataset.code);
      const n = SKUS.filter(k => k.supplierCode === s.code).length;
      if (n) return toast('该供应商已关联 ' + n + ' 个 SKU，无法删除', 'err');
      confirmBox('删除确认', '确认删除供应商【' + esc(s.name) + '】？', () => {

    case 'channel-submit-one': {

        onMount: () => {

            toast('权限已保存并生效', 'ok'); closeModal(); render();
          };

      });
      break;
    case 'log-export': toast('操作日志已导出为 Excel', 'ok'); break;
    case 'log-detail': {
      const l = LOGS.find(x => x.id === Number(t.dataset.id));
      openModal({
        title: '操作日志详情 #' + l.id,
        body: '<dl class="kv"><dt>操作时间</dt><dd class="mono">' + esc(l.time) + '</dd>' +
          '<dt>操作人</dt><dd>' + esc(l.user) + '</dd><dt>来源 IP</dt><dd class="mono">' + esc(l.ip) + '</dd>' +
          '<dt>操作类型</dt><dd>' + badge(l.type, 'gray') + '</dd>' +
          '<dt>操作对象</dt><dd class="mono">' + esc(l.target) + '</dd>' +
          '<dt>操作动作</dt><dd>' + esc(l.action) + '</dd></dl>' +
          '<div class="sec-title">变更前后对比</div>' +

          (l.reason && l.reason !== '—' ? '\n调整原因：' + esc(l.reason) : '') + '</div>'

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('inp')) {
    const keys = { 'f-sku-code':'sku','f-sku-name':'sku','f-sup-name':'sup','f-wh-name':'wh','f-fc-name':'fc',
      'f-adj-name':'adj','f-sf-name':'safety','f-sg-name':'sug','f-po-no':'po','f-po-sku':'po','f-tf-no':'tf','f-tf-sku':'tf',
      'f-usr-name':'usr','f-log-user':'log' };
    const k = keys[e.target.id];
    if (k) applyFilter(k);
  }
});

function importModal(name) {

    title: '导入' + name, narrow: true,

      '<div><span class="tick">1</span>下载导入模板</div>' +

      '<div><span class="tick">3</span>上传已填写的 Excel 文件</div>' +
      '<div><span class="tick">4</span>系统校验后确认导入</div></div>' +
      '<div style="margin-top:16px;display:flex;gap:10px"><button class="btn" id="impTpl">下载模板</button>' +
      '<button class="btn primary" id="impUp">上传文件</button></div>' +
      '<div id="impResult" style="margin-top:14px"></div>',
    foot: null,
    onMount: () => {
      $('#impTpl').onclick = () => toast('模板已下载：' + name + '导入模板.xlsx', 'ok');
      $('#impUp').onclick = () => {
        const n = rint(3, 18);

          '<span class="mono">第 ' + rint(10, 22) + ' 行：SKU编号已存在</span></div></div>' +
          '<button class="btn primary" style="width:100%" onclick="toast(\'成功导入 ' + (n - 2) + ' 条数据\',\'ok\')">确认导入 ' + (n - 2) + ' 条</button>';
      };
    }
  });
}
function runTraining(name) {
  openModal({
    title: '模型训练 · ' + name, narrow: true, foot: null,
    body: '<div style="font-size:13px">正在执行训练任务…</div><div class="loading-bar"><i id="trBar"></i></div>' +

     '切到「采购员」角色 → 系统管理菜单消失；切到「管理层」→ 全量可见（权限矩阵验证）'
    ].map((s, i) => '<div><span class="tick">' + (i + 1) + '</span>' + s + '</div>').join('') + '</div>' +

    '<div class="sec-title">比对专项 SRS 时发现的待确认项（建议回写给需求方）</div>' +
    '<div class="step-list">' +
      ['<b>【销量预测 SRS 内部冲突】业务调整计算口径</b>：第 3 章 3.2.3 写「调整后预测 = 历史趋势预测值 × 调整系数」（乘法），但第 4 章 4.1.2、第 5 章 5.1.1 及 3.3.1 列表字段写「+ 业务调整值」（加法）。<b>原型采用加法口径</b>（与列表字段一致），乘法公式仅作为业务语义在页面公式区并列展示，请确认最终口径',
       '<b>【销量预测 SRS 内部冲突】渠道预测状态机</b>：4.2.2 定义 3 态（待提交 / 已提交 / 已锁定），但旧版整体 SRS 3.5.2.4.3 为 4 态（含待店铺审核 / 待汇总确认 / 已确认）。原型按专项 SRS 采用 3 态，请确认以哪份为准',
       '<b>【销量预测 SRS 内部冲突】第三层「负责人调整」</b>：旧版整体 SRS 3.5.2.5 汇总公式含「负责人最终调整值」，专项 SRS 第 4、5 章均只定义两层。原型已移除该层，请确认',
       '<b>4.2.3 提交校验缺少判定方式</b>：「调整值不能超过 AI 预测值的 ±200%」未说明超限时是阻断提交还是警告后允许，原型按阻断处理',
       '<b>4.2.3 提交时间口径</b>：「只能提交未来 20 周内的预测」与 2.1.2「预测时间范围未来 20 周」一致，但 4.2.1 又要求「每月 1 号提交本月预测」——月度提交与 20 周滚动预测的关系需说明（本月之外的周何时提交？）',
       '<b>4.2.2 状态流转缺「撤回到期」</b>：已锁定为月底自动锁定不可修改，但未定义「已提交」长期未审核时的超时回退规则',
       '<b>2.3.1 ABC 分类划分标准不闭合</b>：A 类「前 80%」+ B 类「80%-95%」+ C 类「后 5%」，但 2.3.3 九宫格表头标注为 A(80%) / B(15%) / C(5%)，两处一致；然而「后 5%」与「80%-95%」之间存在 95%-100% 的表述空档，建议改为统一区间写法',
       '<b>2.4.2 可信度因子缺计算方式</b>：5 个因子（历史数据量 / 数据稳定性 / 模型拟合度 / 预测周期 / 品类一致性）只给了权重，未给各因子 0-100 分的归一化方法，原型按线性映射近似实现',
       '<b>附录 B「预测准确率」目标冲突</b>：MAPE 目标 &lt; 20% 与准确率目标 ≥ 80% 数学上等价（准确率 = 1 − MAPE），但 2.5 流程图写「R² &gt; 0.7 为合格」、附录 B 写「R² 目标 &gt; 0.7」，2.4.4 又写「R² &gt; 0.85」为高可信——三处阈值需统一',
       '<b>角色缺失（沿用上一轮）</b>：4.2.1 引用「店铺负责人」、5.3 引用「总管理员」，但整体 SRS 2.5 只定义 5 个角色，权限矩阵 3.4 中亦无对应列'
      ].map(s => '<div><span class="tick">·</span>' + s + '</div>').join('') + '</div>' +

    '<div class="sec-title">本原型未覆盖（需在下一轮确认）</div>' +
    '<div class="step-list">' +
      ['<b>真实 ERP 数据对接</b>：当前全部为前端模拟数据，接口契约见整体 SRS 第七章',
       '<b>AI 预测算法实现</b>：原型只呈现结果与可信度评分，算法本身（LSTM / Prophet / ARIMA / 指数平滑）尚未接入；2.5 的「特征提取」（趋势 / 季节性 / 节假日）与 R² 训练过程为静态呈现',
       '<b>预测准确率的时间维度计算</b>：附录 B 的 MAPE / RMSE / R² 需实际值与预测值对齐后计算，原型用固定种子的近似值呈现',
       '<b>批量导入的真实文件解析</b>：下载模板 / 上传 / 校验错误行号仅给出交互反馈，未生成或解析真实 Excel',
       '<b>按店铺的数据权限隔离</b>：4.2.1「店铺负责人提交本店预测」已建模状态，但未实现行级数据隔离',
       '<b>SSO 登录与按钮级权限</b>：目前用角色下拉模拟，未接入 ERP 单点登录',
       '<b>筛选控件的多选能力</b>：SRS 中渠道 / 国家 / 店铺 / 状态 / 类型为多选，原型简化为单选',
       '<b>移动端 / 平板适配</b>：当前按 PC 1920×1080 设计'
      ].map(s => '<div><span class="tick">·</span>' + s + '</div>').join('') + '</div>' +

    '<div class="notice warn" style="margin-top:16px">' + icon('warn', 'width:15px;height:15px') +
      '<div>数据说明：本原型所有数字由固定种子生成，刷新页面不会变化，便于反复演示同一场景。' +
      '它不是真实数据，不可用于经营决策。</div></div>',
    foot: '<button class="btn primary" data-close="1">知道了</button>'
  });
}

/* =====================================================================
   18. 初始化
   ===================================================================== */
function init() {
  $('#roleSelect').innerHTML = ROLES.map(r => '<option value="' + r.id + '"' + (r.id === STATE.role ? ' selected' : '') + '>' + r.name + '</option>').join('');
  $('#roleSelect').onchange = e => {
    STATE.role = e.target.value;
    toast('已切换为「' + roleName(STATE.role) + '」视角：' + ROLES.find(r => r.id === STATE.role).desc, 'ok');
    render();
  };
  /* 顶部插入原型说明入口 */
  const btn = document.createElement('button');
  btn.className = 'btn';
  btn.setAttribute('data-act', 'doc');
  btn.innerHTML = icon('info', 'width:13px;height:13px') + '原型说明';
  $('.topbar').insertBefore(btn, $('#syncText').parentNode);
  /* 重算补货建议：重放引擎 */
  $('#btnRecalc').onclick = () => {
    openModal({
      title: '重新计算补货建议', narrow: true, foot: null,
      body: '<div style="font-size:13px">正在执行补货引擎计算…</div><div class="loading-bar"><i id="recalcBar"></i></div>' +
        '<div class="step-list" style="margin-top:14px">' +
        '<div><span class="tick">·</span>拉取 ERP 库存快照与在途库存</div>' +
        '<div><span class="tick">·</span>读取已汇总的 SKU 级总预测销量（SRS 第5章）</div>' +
        '<div><span class="tick">·</span>按补货公式逐 SKU × 仓库计算建议量</div>' +
        '<div><span class="tick">·</span>判断执行方式（采购 / 调拨）并生成建议单</div></div>',
      onMount: () => {
        let p = 0;
        const tm = setInterval(() => {
          p += 7;
          const bar = $('#recalcBar'); if (!bar) return clearInterval(tm);
          bar.style.width = Math.min(100, p) + '%';
          if (p >= 100) {
            clearInterval(tm);
            /* 仅刷新「待审核」的建议；已确认 / 已分发 的记录保留，避免与已生成单据脱节 */
            const others  = SUGGESTIONS.filter(s => s.status !== '待审核');
            const pending = computeSuggestions().filter(s => s.status === '待审核');
            SUGGESTIONS.length = 0;
            Array.prototype.push.apply(SUGGESTIONS, pending.concat(others));
            toast('补货建议已重算：新增待审核 ' + pending.length + ' 条，保留已处理 ' + others.length + ' 条', 'ok');
            closeModal();
            if (STATE.route === 'suggestion') go('suggestion'); else render();
          }
        }, 80);
      }
    });
  };
  render();
}
init();
</script>
</body>
</html>
