<!DOCTYPE html>

<head data-page-node-id="TwycYdpqd8MfiWA2efFBVx">

<title data-page-node-id="w8668ZHaEgwC4PYZSvKzv5" data-pnid-children="MkLLkqNvjXjKLbP2U6kNa4">AI-driven Replenishment 智能补货系统 · 交互原型 V0.5</title>
<style data-page-node-id="aBztNHztnBljNW1wSJM9R5" data-pnid-children="NUSCFjdv9Zre6R9O7vUrop">
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#fafbfc; --surface-3:#f2f4f7;
  --border:#e3e7ed; --border-2:#d3dae3;
  --text:#1b2330; --text-2:#5b6675; --text-3:#8d97a4;
  --accent:#1b5fa8; --accent-dark:#154a83; --accent-bg:#eaf1fa; --accent-line:#c9dcf0;
  --red:#c33f2b; --red-bg:#fcece9; --red-line:#f2cfc8;
  --orange:#ab6d12; --orange-bg:#fdf4e5; --orange-line:#f0dcb6;
  --green:#2b7a4f; --green-bg:#e9f4ee; --green-line:#c6e2d2;
  --teal:#256b76; --teal-bg:#e8f2f3; --teal-line:#c3dfe2;
  --gray:#6b7683; --gray-bg:#eef1f4; --gray-line:#dde2e8;
  --radius:8px; --radius-sm:5px;
  --shadow:0 1px 2px rgba(20,30,45,.05), 0 6px 20px rgba(20,30,45,.06);
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#c9d0d9;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- top bar ---------- */
.topbar{
  height:52px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:0 16px;position:sticky;top:0;z-index:60;
}
.brand{display:flex;align-items:center;gap:9px;min-width:200px}
.brand-mark{
  width:26px;height:26px;border-radius:6px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;flex:0 0 26px;
}
.brand-mark svg{width:16px;height:16px;stroke:#fff}
.brand-title{font-size:14px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.brand-sub{font-size:11px;color:var(--text-3);white-space:nowrap}
.topbar-spacer{flex:1}
.topbar-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
.sync-pill{
  display:flex;align-items:center;gap:7px;background:var(--green-bg);border:1px solid var(--green-line);
  color:var(--green);border-radius:20px;padding:4px 11px;font-size:12px;
}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.role-select{
  border:1px solid var(--border-2);background:var(--surface);border-radius:var(--radius-sm);
  padding:5px 9px;font-size:12px;cursor:pointer;
}
.avatar{
  width:28px;height:28px;border-radius:50%;background:var(--accent-bg);color:var(--accent-dark);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;border:1px solid var(--accent-line);
}

/* ---------- layout ---------- */
.layout{display:flex;align-items:flex-start;min-height:calc(100vh - 52px)}
.sider{
  width:214px;flex:0 0 214px;background:var(--surface);border-right:1px solid var(--border);
  padding:10px 0 40px;position:sticky;top:52px;max-height:calc(100vh - 52px);overflow-y:auto;
}
.nav-group{margin-bottom:2px}
.nav-group-title{
  display:flex;align-items:center;gap:8px;padding:9px 16px;font-size:12.5px;font-weight:600;
  color:var(--text-2);cursor:pointer;user-select:none;
}
.nav-group-title:hover{color:var(--text)}
.nav-group-title svg{width:15px;height:15px;stroke:currentColor;flex:0 0 15px;opacity:.85}
.nav-caret{margin-left:auto;font-size:9px;color:var(--text-3);transition:transform .15s}
.nav-group.collapsed .nav-caret{transform:rotate(-90deg)}
.nav-group.collapsed .nav-items{display:none}
.nav-item{
  display:flex;align-items:center;padding:7px 16px 7px 39px;font-size:13px;color:var(--text-2);
  cursor:pointer;border-left:2px solid transparent;position:relative;
}
.nav-item:hover{background:var(--surface-3);color:var(--text)}
.nav-item.active{background:var(--accent-bg);color:var(--accent-dark);font-weight:600;border-left-color:var(--accent)}
.nav-item .nav-badge{
  margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:600;
  border-radius:9px;padding:0 6px;line-height:16px;min-width:16px;text-align:center;
}
main{flex:1;min-width:0;padding:18px 20px 64px}

/* ---------- page head ---------- */
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-title{font-size:19px;font-weight:600;letter-spacing:.2px;margin:0 0 3px}
.page-desc{font-size:12.5px;color:var(--text-2);max-width:820px}
.page-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumb{font-size:12px;color:var(--text-3);margin-bottom:8px}
.crumb b{color:var(--text-2);font-weight:500}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-2);background:var(--surface);
  color:var(--text);border-radius:var(--radius-sm);padding:6px 13px;font-size:12.5px;cursor:pointer;
  transition:background .12s,border-color .12s,color .12s;white-space:nowrap;
}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff}
.btn.danger:hover{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn[disabled]:hover{border-color:var(--border-2);color:var(--text);background:var(--surface)}
.btn svg{width:13px;height:13px;stroke:currentColor}
.link-btn{background:none;border:none;color:var(--accent);cursor:pointer;padding:0;font-size:12.5px}
.link-btn:hover{text-decoration:underline}
.link-btn.muted{color:var(--text-2)}
.link-btn.warn{color:var(--red)}

/* ---------- cards / kpi ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px}
.card-head{
  display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);
}
.card-head h3{margin:0;font-size:14px;font-weight:600}
.card-head .hint{font-size:12px;color:var(--text-3)}
.card-head .spacer{flex:1}
.card-body{padding:14px 16px}
.card-body.tight{padding:0}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.kpi{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;
  position:relative;overflow:hidden;
}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.85}
.kpi.k-warn::after{background:var(--orange)}
.kpi.k-danger::after{background:var(--red)}
.kpi.k-good::after{background:var(--green)}
.kpi-label{font-size:12px;color:var(--text-2);margin-bottom:6px;display:flex;align-items:center;gap:5px}
.kpi-value{font-size:24px;font-weight:600;line-height:1.15;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.kpi-value small{font-size:12px;font-weight:500;color:var(--text-3);margin-left:3px}
.kpi-foot{font-size:11.5px;color:var(--text-3);margin-top:5px}
.trend-up{color:var(--green)}
.trend-down{color:var(--red)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:1240px){.grid-2,.grid-3{grid-template-columns:1fr}}

/* ---------- filters ---------- */
.filter-bar{
  display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:13px 16px;border-bottom:1px solid var(--border);
  background:var(--surface-2);
}
.field{display:flex;flex-direction:column;gap:4px}
.field > label{font-size:11.5px;color:var(--text-2)}
.inp,.sel{
  border:1px solid var(--border-2);background:var(--surface);border-radius:var(--radius-sm);
  padding:5px 9px;font-size:12.5px;min-width:130px;outline:none;
}
.inp:focus,.sel:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.inp.wide{min-width:190px}
.filter-actions{display:flex;gap:8px;margin-left:auto}

/* ---------- table ---------- */
.table-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th{
  text-align:left;font-weight:600;color:var(--text-2);background:var(--surface-3);
  padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;font-size:12px;
}
table.tbl td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
table.tbl tbody tr:hover{background:var(--accent-bg)}
table.tbl tbody tr.row-danger{background:var(--red-bg)}
table.tbl tbody tr.row-danger:hover{background:#f9e2dd}
table.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
table.tbl .mono{font-family:var(--mono);font-size:12px}
table.tbl .strong{font-weight:600}
table.tbl .empty{text-align:center;color:var(--text-3);padding:40px 0}
.col-check{width:34px}
input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;cursor:pointer}

/* ---------- badges ---------- */
.badge{
  display:inline-flex;align-items:center;gap:4px;border-radius:3px;padding:1px 7px;font-size:11.5px;
  font-weight:500;border:1px solid transparent;line-height:18px;white-space:nowrap;
}
.badge.red{background:var(--red-bg);color:var(--red);border-color:var(--red-line)}
.badge.orange{background:var(--orange-bg);color:var(--orange);border-color:var(--orange-line)}
.badge.green{background:var(--green-bg);color:var(--green);border-color:var(--green-line)}
.badge.blue{background:var(--accent-bg);color:var(--accent-dark);border-color:var(--accent-line)}
.badge.teal{background:var(--teal-bg);color:var(--teal);border-color:var(--teal-line)}
.badge.gray{background:var(--gray-bg);color:var(--gray);border-color:var(--gray-line)}
.badge.violet{background:#eeedf7;color:#4f4a86;border-color:#d9d6ec}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.conf{display:flex;align-items:center;gap:6px}
.conf-bar{width:44px;height:5px;border-radius:3px;background:var(--gray-bg);overflow:hidden;position:relative}
.conf-bar i{display:block;height:100%;border-radius:3px}
.conf-num{font-variant-numeric:tabular-nums;font-weight:600;font-size:12px}
.abc-cell{display:flex;gap:4px;align-items:center}
.progress{height:6px;background:var(--gray-bg);border-radius:3px;overflow:hidden;min-width:70px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px}
/* 库龄分段堆叠条（库存分析 · 库龄分布） */
.stackbar{display:flex;height:24px;border-radius:5px;overflow:hidden;background:var(--surface-3);border:1px solid var(--border)}
.stackbar i{display:block;height:100%}

/* ---------- pagination ---------- */
.pager{display:flex;align-items:center;gap:8px;padding:11px 16px;font-size:12.5px;color:var(--text-2)}
.pager .spacer{flex:1}
.pg-btn{
  border:1px solid var(--border-2);background:var(--surface);border-radius:var(--radius-sm);
  padding:3px 9px;cursor:pointer;font-size:12.5px;min-width:28px;
}
.pg-btn:hover:not([disabled]){border-color:var(--accent);color:var(--accent)}
.pg-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.pg-btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);padding:0 16px;background:var(--surface)}
.tab{
  padding:10px 14px;font-size:13px;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;
  margin-bottom:-1px;
}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent-dark);font-weight:600;border-bottom-color:var(--accent)}

/* ---------- misc ---------- */
.notice{
  display:flex;gap:9px;padding:10px 13px;border-radius:var(--radius-sm);font-size:12.5px;
  border:1px solid var(--accent-line);background:var(--accent-bg);color:var(--accent-dark);margin-bottom:14px;
}
.notice.warn{background:var(--orange-bg);border-color:var(--orange-line);color:var(--orange)}
.notice.danger{background:var(--red-bg);border-color:var(--red-line);color:var(--red)}
.notice svg{width:15px;height:15px;flex:0 0 15px;stroke:currentColor;margin-top:1px}
.formula{
  font-family:var(--mono);font-size:12px;background:var(--surface-3);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:9px 12px;color:var(--text-2);line-height:1.8;white-space:pre-wrap;
}
.formula b{color:var(--accent-dark);font-weight:600}
.kv{display:grid;grid-template-columns:104px 1fr;gap:7px 12px;font-size:12.5px}
.kv dt{color:var(--text-2)}
.kv dd{margin:0;font-weight:500}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2)}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:middle}
.inline-note{font-size:11.5px;color:var(--text-3)}
.sec-title{font-size:12.5px;font-weight:600;color:var(--text-2);margin:16px 0 8px}
.sec-title:first-child{margin-top:0}
.split{display:grid;grid-template-columns:1.55fr 1fr;gap:14px}
@media (max-width:1180px){.split{grid-template-columns:1fr}}

/* ---------- modal ---------- */
.mask{
  position:fixed;inset:0;background:rgba(20,28,40,.42);z-index:200;
  display:flex;align-items:flex-start;justify-content:center;padding:56px 16px;overflow-y:auto;
}
.modal{
  background:var(--surface);border-radius:10px;box-shadow:0 12px 48px rgba(15,25,40,.22);
  width:100%;max-width:620px;animation:pop .14s ease-out;
}
.modal.wide{max-width:920px}
.modal.narrow{max-width:460px}
/* 全屏查看：投屏评审时把走势图放到最大（V0.4） */
.modal.full{max-width:1240px;width:calc(100vw - 48px)}
@keyframes pop{from{transform:translateY(-6px);opacity:.6}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-head h3{margin:0;font-size:15px;font-weight:600}
.modal-close{margin-left:auto;background:none;border:none;cursor:pointer;color:var(--text-3);font-size:19px;line-height:1}
.modal-close:hover{color:var(--text)}
.modal-body{padding:16px 18px}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:12px 18px;border-top:1px solid var(--border);background:var(--surface-2);border-radius:0 0 10px 10px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form-grid .full{grid-column:1/-1}
.form-grid .field > label{font-size:12px;color:var(--text-2)}
.form-grid .field > label .req{color:var(--red);margin-left:2px}
.form-grid .inp,.form-grid .sel{width:100%;min-width:0}
textarea.inp{resize:vertical;min-height:62px;font-family:inherit}

/* ---------- toast ---------- */
#toast-root{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:#212b3a;color:#fff;border-radius:var(--radius-sm);padding:9px 16px;font-size:12.5px;
  box-shadow:0 8px 26px rgba(15,25,40,.26);animation:slideIn .16s ease-out;max-width:560px;
}
.toast.ok{background:#22613f}
.toast.warn{background:#8a5710}
.toast.err{background:#9c3222}
@keyframes slideIn{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}

/* ---------- charts ---------- */
.chart-box{position:relative}
svg.chart{display:block;width:100%;height:auto}
.chart-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--text-2);margin-top:8px}
.chart-legend span{display:inline-flex;align-items:center;gap:5px}
.swatch{width:11px;height:3px;border-radius:2px;display:inline-block}
.swatch.area{height:9px;border-radius:2px;opacity:.35}
.mini-chart{height:56px;width:110px}
/* 列表内走势缩略图（点击等同「查看预测」） */
.spark-cell{width:132px;padding:4px 6px !important;cursor:pointer}
.spark-cell svg{display:block;width:120px;height:34px}
.spark-cell:hover{background:var(--accent-bg)}
/* 详情弹窗内的可交互走势图 */
.ichart-wrap{position:relative}
svg.ichart{display:block;width:100%;height:auto;cursor:crosshair;touch-action:none;user-select:none}
.ichart-ctrl{display:flex;gap:4px;margin-left:auto}
.ichart-ctrl button{font:inherit;font-size:11px;padding:2px 9px;border:1px solid var(--border);
  background:#fff;color:var(--text-2);border-radius:5px;cursor:pointer}
.ichart-ctrl button:hover{border-color:var(--accent);color:var(--accent)}
.ichart-ctrl button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ichart-tip{position:absolute;pointer-events:none;z-index:5;background:rgba(27,35,48,.95);color:#fff;
  font-size:11.5px;line-height:1.65;padding:7px 10px;border-radius:6px;white-space:nowrap;display:none;
  box-shadow:0 4px 14px rgba(15,23,38,.22)}
.ichart-tip b{font-weight:600}
.ichart-tip .tk{color:#9fb6cf}
.empty-state{padding:34px 16px;text-align:center;color:var(--text-3);font-size:12.5px}
.loading-bar{height:3px;background:var(--accent-bg);border-radius:2px;overflow:hidden;margin-top:10px}
.loading-bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .18s linear}
.step-list{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--text-2)}
.step-list div{display:flex;align-items:center;gap:8px}
.step-list .tick{color:var(--green);font-weight:700}
</style>
</head>

function invStatusOf(i) {

  if (i.expiryDays !== null && i.expiryDays <= 0) return '过期';

}
function alertTypeOf(i) {
  if (i.qty < 0) return '库存为负';
  if (i.expiryDays !== null && i.expiryDays < 30) return '临近效期';
  if (i.available < i.safety) return '低于安全库存';
  if (i.qty > i.upperLimit) return '高于库存上限';
  if (i.idleDays > 90) return '呆滞预警';
  return '';
}
const STOCK_ALERTS = [];
(function buildAlerts() {
  INVENTORY.forEach(i => {
    const type = alertTypeOf(i);
    if (!type) return;
    let cur, threshold, unit;
    if (type === '库存为负')          { cur = i.qty;        threshold = 0;          unit = '件'; }
    else if (type === '临近效期')     { cur = i.expiryDays; threshold = 30;         unit = '天'; }
    else if (type === '低于安全库存') { cur = i.available;  threshold = i.safety;   unit = '件'; }
    else if (type === '高于库存上限') { cur = i.qty;        threshold = i.upperLimit; unit = '件'; }
    else                              { cur = i.idleDays;   threshold = 90;         unit = '天'; }
    let urgent = '正常';
    if (type === '库存为负') urgent = '紧急';
    else if (type === '临近效期' && i.expiryDays < 7) urgent = '紧急';
    else if (type === '低于安全库存' && i.available < i.safety * 0.5) urgent = '紧急';
    else if (type === '高于库存上限' && i.qty > i.upperLimit * 1.5) urgent = '紧急';
    else if (type === '呆滞预警' && i.idleDays > 180) urgent = '紧急';
    const daysAgo = rint(0, 9);
    const handled = rnd() < 0.30;
    STOCK_ALERTS.push({
      id: 'AL' + String(STOCK_ALERTS.length + 1).padStart(4, '0'),
      type: type, urgent: urgent, sku: i.sku, wh: i.wh,
      cur: cur, threshold: threshold, gap: Math.abs(cur - threshold), unit: unit,
      time: fmtDate(addDays(TODAY, -daysAgo)) + ' ' + String(rint(8, 19)).padStart(2, '0') + ':' + String(rint(0, 59)).padStart(2, '0'),

/* ---- 库存变动记录（确定性生成，按 SKU + 仓库 延迟计算） ---- */
function movesOf(skuCode, whCode) {
  const i = invOf(skuCode, whCode);
  if (!i) return [];
  const seed = (((skuCode.charCodeAt(skuCode.length - 1) || 65) * 131) +
                ((whCode.charCodeAt(whCode.length - 1) || 67) * 977) + 20260916) >>> 0;
  const r = lcg(seed);
  const TYPES = ['入库', '出库', '出库', '预留', '解预留', '调拨', '盘点'];
  const evts = [];
  let sum = 0;
  for (let k = 0; k < 12; k++) {
    const t = TYPES[Math.floor(r() * TYPES.length)];
    let d;
    if (t === '入库')        d =  Math.round(i.daily * (2 + r() * 6));
    else if (t === '出库')   d = -Math.round(i.daily * (0.6 + r() * 2.2));
    else if (t === '预留')   d = -Math.round(i.daily * (0.3 + r() * 1.2));
    else if (t === '解预留') d =  Math.round(i.daily * (0.3 + r() * 1.0));
    else if (t === '调拨')   d = (r() < 0.5 ? 1 : -1) * Math.round(i.daily * (1 + r() * 4));
    else                     d = Math.round((r() - 0.45) * i.daily * 1.6);
    evts.push({ t: t, d: d, daysAgo: 34 - k * 3 + Math.floor(r() * 2) });
    sum += d;
  }
  evts.sort((a, b) => b.daysAgo - a.daysAgo);
  let bal = i.qty - sum;
  const rows = evts.map((e, k) => {
    bal += e.d;
    const pre = { '入库':'IN', '出库':'SO', '预留':'RS', '解预留':'RS', '调拨':'TR', '盘点':'CK' }[e.t];
    return {
      time: fmtDate(addDays(TODAY, -e.daysAgo)) + ' ' + String(8 + (k % 11)).padStart(2, '0') + ':' + String((k * 7 + 12) % 60).padStart(2, '0'),
      type: e.t, delta: e.d, balance: bal,
      doc: pre + '-2026' + String(700000 + (k + 1) * 1237 + (whCode.length * 31)).slice(-6),
      user: ['陈立', '李思远', '张明', '系统同步'][k % 4]
    };
  });
  return rows.slice().reverse();
}

                 'WH-DE-01':'Amazon DE 专营店', 'FBA-DE-01':'Amazon DE 专营店', 'WH-CN-01':'速卖通全球店' };
/* =====================================================================
   4. 图表引擎（手写 SVG，无第三方依赖）
   ===================================================================== */
const PALETTE = ['#1b5fa8', '#256b76', '#ab6d12', '#2b7a4f', '#7a5c3e', '#5b6675', '#c33f2b', '#4a6fa5'];

function arcPath(cx, cy, R, r, a1, a2, fill) {
  const P = (rad, a) => [cx + rad * Math.cos(a), cy + rad * Math.sin(a)];
  const p1 = P(R, a1), p2 = P(R, a2), p3 = P(r, a2), p4 = P(r, a1);
  const large = (a2 - a1) > Math.PI ? 1 : 0;
  return '<path d="M' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2) +
    'A' + R + ' ' + R + ' 0 ' + large + ' 1 ' + p2[0].toFixed(2) + ' ' + p2[1].toFixed(2) +
    'L' + p3[0].toFixed(2) + ' ' + p3[1].toFixed(2) +
    'A' + r + ' ' + r + ' 0 ' + large + ' 0 ' + p4[0].toFixed(2) + ' ' + p4[1].toFixed(2) + 'Z" fill="' + fill + '"/>';
}
/* 环形图 */
function chartDonut(items, opt) {
  const o = opt || {}, size = o.size || 176, cx = size / 2, cy = size / 2, R = size / 2 - 4, r = R * 0.62;
  const total = items.reduce((a, b) => a + b.value, 0) || 1;
  let ang = -Math.PI / 2, seg = '';
  if (items.length === 1) {
    seg = '<circle cx="' + cx + '" cy="' + cy + '" r="' + ((R + r) / 2) + '" fill="none" stroke="' + items[0].color + '" stroke-width="' + (R - r) + '"/>';
  } else {
    items.forEach(it => {
      const a2 = ang + (it.value / total) * Math.PI * 2;
      if (it.value > 0) seg += arcPath(cx, cy, R, r, ang, a2 - 0.012, it.color);
      ang = a2;
    });
  }
  const center = o.center
    ? '<text x="' + cx + '" y="' + (cy - 3) + '" text-anchor="middle" font-size="19" font-weight="600" fill="#1b2330">' + o.center[0] + '</text>' +
      '<text x="' + cx + '" y="' + (cy + 14) + '" text-anchor="middle" font-size="10.5" fill="#8d97a4">' + o.center[1] + '</text>'
    : '';
  return '<svg viewBox="0 0 ' + size + ' ' + size + '" style="width:' + size + 'px;height:' + size + 'px" class="chart">' + seg + center + '</svg>';
}
/* 折线图：支持预测区间阴影 + 历史实线 + 预测虚线 */
/* 折线图：支持预测区间阴影 + 历史实线 + 预测虚线
   zeroBase:true  → 基线固定 0（适合销量等绝对量，避免夸大差异）
   zeroBase:false → 自适应基线（适合准确率、周转天数等比率型指标） */
function chartForecast(opt) {
  const W = 660, H = opt.height || 224, pad = { t: 14, r: 12, b: 26, l: 46 };
  const labels = opt.labels, actual = opt.actual || [], fc = opt.fc || [], lo = opt.lo || [], hi = opt.hi || [];
  const all = (actual.concat(fc).concat(hi).concat(lo)).filter(v => typeof v === 'number' && isFinite(v));
  const dMax = all.length ? Math.max.apply(null, all) : 1;
  const dMin = all.length ? Math.min.apply(null, all) : 0;
  const span = (dMax - dMin) || 1;
  let min = 0, max = dMax * 1.12;
  if (opt.zeroBase === false) {                 /* 比率型指标：自适应基线 */
    min = Math.max(0, dMin - span * 0.45);
    max = dMax + span * 0.22;
  }
  const dec = (max - min) < 8 ? 1 : 0;
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const n = labels.length;
  const X = i => pad.l + (n <= 1 ? iw / 2 : (i * iw) / (n - 1));
  const Y = v => pad.t + ih - ((v - min) / (max - min || 1)) * ih;
  let g = '';
  for (let k = 0; k <= 4; k++) {
    const v = min + (max - min) * k / 4, y = Y(v);
    g += '<line x1="' + pad.l + '" y1="' + y + '" x2="' + (W - pad.r) + '" y2="' + y + '" stroke="#eef1f5"/>' +
         '<text x="' + (pad.l - 6) + '" y="' + (y + 3.5) + '" text-anchor="end" font-size="10" fill="#8d97a4">' + nf(v, dec) + '</text>';
  }
  /* 预测区间阴影 */
  let band = '';
  if (hi.length) {
    const s = actual.length - 1;
    let up = '', dn = '';
    for (let i = 0; i < hi.length; i++) { up += (i ? 'L' : 'M') + X(s + i) + ' ' + Y(hi[i]); }
    for (let i = lo.length - 1; i >= 0; i--) { dn += 'L' + X(s + i) + ' ' + Y(lo[i]); }
    band = '<path d="' + up + dn + 'Z" fill="#1b5fa8" opacity="0.13"/>';
  }
  /* 分割线 */
  const split = '<line x1="' + X(actual.length - 1) + '" y1="' + pad.t + '" x2="' + X(actual.length - 1) + '" y2="' + (pad.t + ih) + '" stroke="#c9d0d9" stroke-dasharray="3 3"/>' +
    '<text x="' + (X(actual.length - 1) + 5) + '" y="' + (pad.t + 11) + '" font-size="10" fill="#8d97a4">预测起点</text>';
  const line = arr => arr.map((v, i) => (i ? 'L' : 'M') + X(i) + ' ' + Y(v)).join('');
  const solid = actual.length ? '<path d="' + line(actual) + '" fill="none" stroke="#1b5fa8" stroke-width="2"/>' : '';
  let dashed = '';
  if (fc.length) {
    const off = actual.length - 1;
    const pts = [actual[actual.length - 1]].concat(fc);
    dashed = '<path d="' + pts.map((v, i) => (i ? 'L' : 'M') + X(off + i) + ' ' + Y(v)).join('') +
      '" fill="none" stroke="#ab6d12" stroke-width="2" stroke-dasharray="5 3"/>';
  }
  let ticks = '';
  const step = Math.max(1, Math.round(n / 9));
  labels.forEach((lb, i) => {
    if (i % step) return;
    ticks += '<text x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10" fill="#8d97a4">' + lb + '</text>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart">' + g + band + split + solid + dashed + ticks + '</svg>';
}
/* 列表内走势缩略图：近 12 周实际 + 未来 4 周预测，点击跳转详情 */
function sparkSvg(skuCode, whCode) {
  const hist = histSeries(skuBy(skuCode), whCode, 12).map(h => h.value);
  const futs = FORECAST.filter(f => f.sku === skuCode && f.wh === whCode).sort((a, b) => a.w - b.w).slice(0, 4);
  const fc = futs.map(f => f.ai + f.adj);
  const all = hist.concat(fc);
  const max = Math.max.apply(null, all) || 1, min = Math.min.apply(null, all);
  const rng = (max - min) || 1;
  const W = 120, H = 34, pl = 2, pr = 2, pt = 4, pb = 4;
  const iw = W - pl - pr, ih = H - pt - pb;
  const n = all.length;
  const X = i => pl + (n <= 1 ? iw / 2 : (i * iw) / (n - 1));
  const Y = v => pt + ih - ((v - min) / rng) * ih;
  const ln = a => a.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('');
  let d = '<path d="' + ln(hist) + '" fill="none" stroke="#1b5fa8" stroke-width="1.4"/>';
  if (fc.length) {
    const off = hist.length - 1;
    const pts = [hist[hist.length - 1]].concat(fc);
    d += '<path d="' + pts.map((v, i) => (i ? 'L' : 'M') + X(off + i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('') +
      '" fill="none" stroke="#ab6d12" stroke-width="1.4" stroke-dasharray="3 2"/>';
    d += '<line x1="' + X(off).toFixed(1) + '" y1="' + pt + '" x2="' + X(off).toFixed(1) + '" y2="' + (pt + ih) +
      '" stroke="#c9d0d9" stroke-dasharray="2 2"/>';
  }
  /* 末点锚点，提示该周的预测水平 */
  const lastY = Y(fc.length ? fc[fc.length - 1] : hist[hist.length - 1]);
  d += '<circle cx="' + X(n - 1).toFixed(1) + '" cy="' + lastY.toFixed(1) + '" r="1.9" fill="#ab6d12"/>';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' + d + '</svg>';
}
/* 柱状图 */
function chartBars(items, opt) {
  const o = opt || {}, W = 660, H = o.height || 200, pad = { t: 14, r: 12, b: 40, l: 48 };
  const max = Math.max.apply(null, items.map(i => i.value)) * 1.15 || 1;
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const bw = Math.min(46, (iw / items.length) * 0.6);
  let out = '';
  for (let k = 0; k <= 4; k++) {
    const y = pad.t + ih - (ih * k) / 4;
    out += '<line x1="' + pad.l + '" y1="' + y + '" x2="' + (W - pad.r) + '" y2="' + y + '" stroke="#eef1f5"/>' +
      '<text x="' + (pad.l - 6) + '" y="' + (y + 3.5) + '" text-anchor="end" font-size="10" fill="#8d97a4">' + nf((max * k) / 4) + '</text>';
  }
  items.forEach((it, i) => {
    const cx = pad.l + (iw / items.length) * (i + 0.5);
    const h = (it.value / max) * ih;
    out += '<rect x="' + (cx - bw / 2) + '" y="' + (pad.t + ih - h) + '" width="' + bw + '" height="' + Math.max(1, h) +
      '" rx="2" fill="' + (it.color || PALETTE[0]) + '"/>';
    out += '<text x="' + cx + '" y="' + (pad.t + ih - h - 5) + '" text-anchor="middle" font-size="10.5" fill="#5b6675">' + nf(it.value) + '</text>';
    out += '<text x="' + cx + '" y="' + (H - 22) + '" text-anchor="middle" font-size="10" fill="#8d97a4">' + esc(it.label) + '</text>';
    if (it.sub) out += '<text x="' + cx + '" y="' + (H - 9) + '" text-anchor="middle" font-size="9.5" fill="#b3bac3">' + esc(it.sub) + '</text>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart">' + out + '</svg>';
}
/* 雷达图：可信度五因子 */
function chartRadar(axes) {
  const S = 250, c = S / 2, R = 88;
  const n = axes.length;
  const pt = (i, v) => [c + R * v * Math.cos(-Math.PI / 2 + (2 * Math.PI * i) / n), c + R * v * Math.sin(-Math.PI / 2 + (2 * Math.PI * i) / n)];
  let grid = '';
  [0.25, 0.5, 0.75, 1].forEach(k => {
    const p = axes.map((_, i) => pt(i, k).map(x => x.toFixed(1)).join(',')).join(' ');
    grid += '<polygon points="' + p + '" fill="none" stroke="#e6eaf0"/>';
  });
  let spokes = '', ticks = '';
  axes.forEach((a, i) => {
    const q = pt(i, 1);
    spokes += '<line x1="' + c + '" y1="' + c + '" x2="' + q[0] + '" y2="' + q[1] + '" stroke="#e6eaf0"/>';
    const l = pt(i, 1.22);
    const anchor = Math.abs(l[0] - c) < 4 ? 'middle' : (l[0] > c ? 'start' : 'end');
    ticks += '<text x="' + l[0] + '" y="' + (l[1] + 3.5) + '" text-anchor="' + anchor + '" font-size="10" fill="#5b6675">' + esc(a.label) + '</text>';
  });
  const poly = axes.map((a, i) => pt(i, Math.max(0.04, a.value / 100)).map(x => x.toFixed(1)).join(',')).join(' ');
  return '<svg viewBox="0 0 ' + S + ' ' + S + '" style="width:' + S + 'px;height:' + S + 'px" class="chart">' + grid + spokes +
    '<polygon points="' + poly + '" fill="#1b5fa8" fill-opacity="0.18" stroke="#1b5fa8" stroke-width="1.6"/>' + ticks + '</svg>';
}
/* 可交互走势图（详情弹窗）：悬浮查询、框选放大、点击缩放、拖拽平移、双击复位
   坐标全部由 data-* 参数在挂载时算好，避免把大数组塞进属性里
   —— opt.actual / opt.fc / opt.lo / opt.hi 为四个序列，opt.actualLen 为实际序列长度 */
function chartInteractive(opt) {
  const labels = opt.labels || [], actual = opt.actual || [], fc = opt.fc || [], lo = opt.lo || [], hi = opt.hi || [];
  const n = labels.length;
  const all = actual.concat(fc).concat(hi).concat(lo).filter(v => typeof v === 'number' && isFinite(v));
  const dMax = all.length ? Math.max.apply(null, all) : 1;
  const isRatio = opt.zeroBase === false;
  /* 画布尺寸可调：详情 900×300，全屏 900×420（高度只影响显示比例，坐标仍按 900 归一化） */
  const W = 900, H = opt.height || 300, pad = { t: 16, r: 14, b: 28, l: 52 };
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const X = (i, len) => pad.l + (len <= 1 ? iw / 2 : (i * iw) / (len - 1));
  const Y = (v, min, max) => pad.t + ih - ((v - min) / ((max - min) || 1)) * ih;

  const parts = [];
  parts.push('<div class="ichart-wrap" data-ichart' +
    ' data-n="' + n + '"' + ' data-actual-len="' + actual.length + '"' +
    ' data-rmin="' + (isRatio ? 'auto' : '0') + '"' + ' data-rmax="' + dMax + '"' +
    ' data-ratio="' + (isRatio ? '1' : '0') + '" data-w="' + W + '" data-h="' + H + '"' +
    ' data-pad="' + pad.t + ',' + pad.r + ',' + pad.b + ',' + pad.l + '"' +
    ' data-labels="' + esc(labels.join('|')) + '">' +
    '<svg class="ichart" viewBox="0 0 ' + W + ' ' + H + '"><g class="ic-static"></g><g class="ic-dyn"></g></svg>' +
    '<div class="ichart-tip"></div></div>');
  /* 图例与说明（HTML 层，避免 SVG text 缩放问题） */
  parts.push('<div class="chart-legend">' +
    '<span><i class="swatch" style="background:#1b5fa8"></i>历史实际销量</span>' +
    '<span><i class="swatch" style="background:#ab6d12"></i>未来预测销量（含第二层调整）</span>' +
    '<span><i class="swatch area" style="background:#1b5fa8"></i>置信区间（' + MODEL_PARAMS.ci + '，越远越宽）</span>' +
    '<span class="inline-note" style="margin-left:auto">悬浮查看数值 · 拖拽框选放大 · 滚轮缩放 · 双击复位</span></div>');
  return parts.join('');
}

/* 迷你趋势线 */
function chartSpark(values, tone) {
  const W = 110, H = 30, max = Math.max.apply(null, values) || 1, min = Math.min.apply(null, values);
  const X = i => (i / (values.length - 1)) * W, Y = v => H - 3 - ((v - min) / (max - min || 1)) * (H - 8);
  const c = tone === 'down' ? '#c33f2b' : '#2b7a4f';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="mini-chart"><path d="' +
    values.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('') +
    '" fill="none" stroke="' + c + '" stroke-width="1.6"/></svg>';

/* 误差分布直方图 */
function chartHist(bins, opt) {
  const o = opt || {}, W = 660, H = 180, pad = { t: 12, r: 12, b: 34, l: 44 };
  const max = Math.max.apply(null, bins.map(b => b.value)) * 1.2 || 1;
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b, bw = iw / bins.length;
  let out = '';
  bins.forEach((b, i) => {
    const h = (b.value / max) * ih, x = pad.l + bw * i;
    out += '<rect x="' + (x + 1) + '" y="' + (pad.t + ih - h) + '" width="' + (bw - 2) + '" height="' + Math.max(1, h) +
      '" rx="2" fill="' + (b.tone ? b.tone : '#8aa9c9') + '"/>';
    out += '<text x="' + (x + bw / 2) + '" y="' + (H - 16) + '" text-anchor="middle" font-size="10" fill="#8d97a4">' + esc(b.label) + '</text>';
  });
  out += '<line x1="' + pad.l + '" y1="' + (pad.t + ih) + '" x2="' + (W - pad.r) + '" y2="' + (pad.t + ih) + '" stroke="#d3dae3"/>';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart">' + out + '</svg>';

/* =====================================================================
   4b. 可交互走势图引擎（详情弹窗）
   ---------------------------------------------------------------------
   与列表缩略图同源取数（histSeries + FORECAST），保证「列表看到的形状」
   和「点开后放大的形状」完全一致，只是分辨率与可操作性不同。
   不引入任何第三方图表库 —— 缩放靠重算坐标重建 SVG 属性，
   而不是 CSS transform，这样字号与线宽在放大后不会跟着变形。
   ===================================================================== */
const ICHART = { sku:'', wh:'', hover:-1, hoverPx:0, hoverPy:0, drag:null, ctrl:'drag' };
function ichartData() {
  const sku = skuBy(ICHART.sku);
  const hist = histSeries(sku, ICHART.wh, 52);
  const futs = FORECAST.filter(f => f.sku === ICHART.sku && f.wh === ICHART.wh).sort((a, b) => a.w - b.w);
  return {
    sku: sku, labels: hist.map(h => h.label).concat(futs.map(f => f.week.slice(5))),
    actual: hist.map(h => h.value),
    fc: futs.map(f => f.ai + f.adj),
    lo: futs.map(f => Math.max(0, f.lower + f.adj)),
    hi: futs.map(f => f.upper + f.adj),
    futs: futs
  };
}
function ichartBounds(wrap, D) {
  const ratio = wrap.dataset.ratio === '1';
  const all = D.actual.concat(D.fc).concat(D.hi).concat(D.lo).filter(v => typeof v === 'number' && isFinite(v));
  const dMax = all.length ? Math.max.apply(null, all) : 1;
  const dMin = all.length ? Math.min.apply(null, all) : 0;
  const span = (dMax - dMin) || 1;
  const fullMin = ratio ? Math.max(0, Math.floor(dMin - span * 0.14)) : 0;
  const fullMax = ratio ? Math.ceil(dMax + span * 0.08) : Math.ceil(dMax * 1.12);
  const vmin = parseFloat(wrap.dataset.vmin), vmax = parseFloat(wrap.dataset.vmax);
  const lo = isNaN(vmin) ? fullMin : Math.max(fullMin, vmin);
  let hiB = isNaN(vmax) ? fullMax : Math.min(fullMax, vmax);
  if (hiB - lo < 1) hiB = lo + Math.max(1, span * 0.02);
  const n = D.labels.length, pmax = Math.max(1, n - 1);
  const pmin = Math.max(0, Math.min(parseFloat(wrap.dataset.vminI) || 0, pmax - 1));
  let pmaxI = parseFloat(wrap.dataset.vmaxI);
  pmaxI = isNaN(pmaxI) ? pmax : Math.min(pmax, pmaxI);
  if (pmaxI - pmin < 1) pmaxI = Math.min(pmax, pmin + 1);
  return { fullMin: fullMin, fullMax: fullMax, lo: lo, hi: hiB, pmin: pmin, pmaxI: pmaxI };
}
function ichartRender(wrap) {
  if (!wrap || !wrap.querySelector) return;
  const D = ichartData();
  const W = parseFloat(wrap.dataset.w) || 900, H = parseFloat(wrap.dataset.h) || 300;
  const pd = wrap.dataset.pad.split(',').map(Number);
  const top = pd[0], right = pd[1], bot = pd[2], left = pd[3];
  const iw = W - left - right, ih = H - top - bot;
  const B = ichartBounds(wrap, D);
  const n = D.labels.length, aLen = D.actual.length;
  const fspan = (B.fullMax - B.fullMin) || 1, zspan = (B.hi - B.lo) || 1;
  const zoomed = !!wrap.dataset.vminI || !!wrap.dataset.vmaxI;
  const X = i => left + ((i - B.pmin) / ((B.pmaxI - B.pmin) || 1)) * iw;
  const Y = v => top + ih - ((v - B.lo) / zspan) * ih;
  const d3 = Math.abs(zspan) < 8 ? 1 : 0;
  let s = '';
  for (let k = 0; k <= 4; k++) {
    const v = B.lo + (zspan * k) / 4, y = Y(v);
    s += '<line x1="' + left + '" y1="' + y.toFixed(1) + '" x2="' + (W - right) + '" y2="' + y.toFixed(1) + '" stroke="#eef1f5"/>' +
      '<text x="' + (left - 7) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end" font-size="11" fill="#8d97a4">' + nf(v, d3) + '</text>';
  }
  const step = Math.max(1, Math.ceil((B.pmaxI - B.pmin) / 9));
  for (let i = Math.ceil(B.pmin / step) * step; i <= B.pmaxI; i += step) {
    const x = X(i);
    s += '<line x1="' + x.toFixed(1) + '" y1="' + top + '" x2="' + x.toFixed(1) + '" y2="' + (top + ih) + '" stroke="#f5f7fa"/>' +
      '<text x="' + x.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10.5" fill="#8d97a4">' + esc(D.labels[i] || '') + '</text>';
  }
  /* 置信区间带：按全局位置裁剪，避免放大后画到视窗外 */
  if (D.hi.length) {
    let up = '', dn = '', has = false;
    for (let i = 0; i < D.hi.length; i++) {
      const gi = aLen - 1 + i;
      if (gi < B.pmin || gi > B.pmaxI) continue;
      up += 'L' + X(gi).toFixed(1) + ' ' + Y(D.hi[i]).toFixed(1); has = true;
    }
    for (let i = D.lo.length - 1; i >= 0; i--) {
      const gi = aLen - 1 + i;
      if (gi < B.pmin || gi > B.pmaxI) continue;
      dn += 'L' + X(gi).toFixed(1) + ' ' + Y(D.lo[i]).toFixed(1);
    }
    if (has && dn) s += '<path d="M' + up.slice(1) + dn + 'Z" fill="#1b5fa8" opacity="0.13"/>';
  }
  const segPath = (arr, offI, includeFrom) => {
    let d = '', open = false;
    for (let i = includeFrom; i < arr.length; i++) {
      const gi = offI + i;

    if (isFc) {

        '<line x1="' + left + '" y1="' + Y(D.hi[i - aLen]).toFixed(1) + '" x2="' + (W - right) + '" y2="' + Y(D.hi[i - aLen]).toFixed(1) + '" stroke="#c9d0d9" stroke-dasharray="2 3"/>';

function ichartTip(wrap, idx) {
  const tip = wrap.querySelector('.ichart-tip');
  if (!tip) return;
  const D = ichartData(), aLen = D.actual.length;
  if (idx < 0 || idx >= D.labels.length) { tip.style.display = 'none'; return; }
  const isFc = idx >= aLen, v = isFc ? D.fc[idx - aLen] : D.actual[idx];
  let html = '<div><b>' + esc(D.labels[idx]) + '</b> <span class="tk">' + (isFc ? '预测' : '实际') + '</span></div>';
  if (isFc) {
    const fu = D.futs[idx - aLen];
    html += '<div>预测销量　<b>' + nf(fu.ai) + '</b></div>' +
      '<div>业务调整　<b>' + (fu.adj > 0 ? '+' : '') + nf(fu.adj) + '</b></div>' +
      '<div>调整后预测　<b>' + nf(v) + '</b></div>' +
      '<div class="tk">置信区间 ' + nf(fu.lower + fu.adj) + ' ~ ' + nf(fu.upper + fu.adj) + '</div>' +
      '<div class="tk">提交状态 ' + esc(fu.status) + '</div>';
  } else {
    html += '<div>实际销量　<b>' + nf(v) + '</b></div>';
    if (idx > 0) {

      html += '<div class="tk">环比 ' + (chg > 0 ? '+' : '') + chg.toFixed(1) + '%</div>';
    }

  tip.style.display = 'block';
  const host = wrap.getBoundingClientRect();
  const x = ICHART.hoverPx + 14, y = ICHART.hoverPy - tip.offsetHeight / 2;
  tip.style.left = Math.max(4, Math.min(Math.max(4, host.width - tip.offsetWidth - 4), x)) + 'px';
  tip.style.top = Math.max(4, Math.min(Math.max(4, host.height - tip.offsetHeight - 4), y)) + 'px';

function ichartReset(wrap) {

function ichartZoomBy(wrap, factor) {
  const D = ichartData(), B = ichartBounds(wrap, D);
  const span = B.pmaxI - B.pmin;
  const ns = Math.max(2, Math.min(D.labels.length - 1, Math.round(span * factor)));
  const c = Math.round((B.pmin + B.pmaxI) / 2);
  let i0 = c - Math.round(ns / 2), i1 = i0 + ns;
  if (i0 < 0) { i0 = 0; i1 = ns; }
  if (i1 > D.labels.length - 1) { i1 = D.labels.length - 1; i0 = Math.max(0, i1 - ns); }
  wrap.dataset.vminI = i0; wrap.dataset.vmaxI = i1;
  ichartRender(wrap);
}
/* 挂载：渲染一次全量视图并绑定交互（幂等，重复调用不会重复绑定） */
function initInteractiveCharts() {
  document.querySelectorAll('[data-ichart]').forEach(function (wrap) {
    ichartRender(wrap);
    if (wrap.dataset.bound) return;
    wrap.dataset.bound = '1';
    const svg = wrap.querySelector('svg.ichart');
    /* 画布归一化尺寸从 data-w / data-h 读取（详情 900×300、全屏 900×420），
       不要硬编码 300，否则全屏模式下纵向坐标会整体偏移 */
    const ptOf = e => {
      const r = svg.getBoundingClientRect();
      const bw = parseFloat(wrap.dataset.w) || 900, bh = parseFloat(wrap.dataset.h) || 300;
      return { x: ((e.clientX - r.left) / (r.width || 1)) * bw, y: ((e.clientY - r.top) / (r.height || 1)) * bh };
    };
    /* 当前画布宽度，供 applyHover 计算索引 */
    const bwOf = () => parseFloat(wrap.dataset.w) || 900;
    const applyHover = e => {
      const p = ptOf(e), D = ichartData(), B = ichartBounds(wrap, D);
      const pd = wrap.dataset.pad.split(',').map(Number);
      const iw = bwOf() - pd[3] - pd[1];
      let idx = Math.round(B.pmin + ((p.x - pd[3]) / iw) * (B.pmaxI - B.pmin));
      idx = Math.max(0, Math.min(D.labels.length - 1, idx));
      ICHART.hover = idx;
      const host = wrap.getBoundingClientRect();
      ICHART.hoverPx = e.clientX - host.left;
      ICHART.hoverPy = e.clientY - host.top;
      ichartRender(wrap);
      ichartTip(wrap, idx);
    };
    svg.addEventListener('mouseleave', function () {
      ICHART.hover = -1;
      const tip = wrap.querySelector('.ichart-tip'); if (tip) tip.style.display = 'none';
      ichartRender(wrap);
    });
    svg.addEventListener('mousemove', function (e) {
      if (ICHART.drag && ICHART.drag.active && !ICHART.drag.pan) {
        ICHART.drag.x1 = ptOf(e).x;
        ichartRender(wrap);
        return;
      }
      applyHover(e);
    });
    svg.addEventListener('mousedown', function (e) {
      if (e.button !== 0) return;
      const p = ptOf(e);
      if (ICHART.ctrl === 'zoom') {                    /* 点击放大：以点击处为中心 */
        const D = ichartData(), B = ichartBounds(wrap, D);
        const span = B.pmaxI - B.pmin;
        const ns = Math.max(2, Math.round(span / 1.6));
        let i0 = Math.round((ICHART.hover >= 0 ? ICHART.hover : (B.pmin + B.pmaxI) / 2) - ns / 2);
        let i1 = i0 + ns;
        if (i0 < 0) { i0 = 0; i1 = ns; }
        if (i1 > D.labels.length - 1) { i1 = D.labels.length - 1; i0 = Math.max(0, i1 - ns); }
        wrap.dataset.vminI = i0; wrap.dataset.vmaxI = i1;
        ichartRender(wrap);
        e.preventDefault();
        return;
      }
      ICHART.drag = { active: true, pan: ICHART.ctrl === 'pan', x0: p.x, y0: p.y, x1: p.x, y1: p.y };
      if (ICHART.ctrl === 'pan') svg.style.cursor = 'grabbing';
      e.preventDefault();
    });
    svg.addEventListener('mouseup', function (e) {
      const d = ICHART.drag;
      if (!d || !d.active) return;
      const p = ptOf(e), D = ichartData(), B = ichartBounds(wrap, D);
      const pd = wrap.dataset.pad.split(',').map(Number);
      const iw = (parseFloat(wrap.dataset.w) || 900) - pd[3] - pd[1];
      const ih = (parseFloat(wrap.dataset.h) || 300) - pd[0] - pd[2];
      const px2i = px => B.pmin + ((px - pd[3]) / iw) * (B.pmaxI - B.pmin);
      const py2v = py => B.hi - ((py - pd[0]) / ih) * (B.hi - B.lo);
      if (d.pan) {                                     /* 平移：按位移反算位置区间 */
        const shift = px2i(d.x0) - px2i(p.x);
        let i0 = Math.round(B.pmin + shift), i1 = Math.round(B.pmaxI + shift);
        if (i0 < 0) { i1 -= i0; i0 = 0; }
        if (i1 > D.labels.length - 1) { i0 -= (i1 - (D.labels.length - 1)); i1 = D.labels.length - 1; }
        wrap.dataset.vminI = Math.max(0, i0);
        wrap.dataset.vmaxI = Math.min(D.labels.length - 1, Math.max(i0 + 1, i1));
      } else if (Math.abs(p.x - d.x0) > 12) {           /* 框选放大 */
        let i0 = Math.floor(Math.min(px2i(d.x0), px2i(p.x))), i1 = Math.ceil(Math.max(px2i(d.x0), px2i(p.x)));
        i0 = Math.max(0, Math.min(i0, D.labels.length - 2));
        i1 = Math.min(D.labels.length - 1, Math.max(i1, i0 + 1));
        const vTop = Math.max(py2v(d.y0), py2v(p.y)), vBot = Math.min(py2v(d.y0), py2v(p.y));
        wrap.dataset.vminI = i0; wrap.dataset.vmaxI = i1;
        /* 只有纵向选区明显时才裁剪数值轴，否则保留原范围（更贴合「看趋势」的直觉） */
        if (Math.abs(d.y0 - p.y) > ih * 0.25) { wrap.dataset.vmin = vBot; wrap.dataset.vmax = vTop; }
      } else if (ICHART.ctrl === 'drag') {              /* 单击放大一档 */
        ichartZoomBy(wrap, 1 / 1.6);
      }
      ICHART.drag = null;
      svg.style.cursor = ICHART.ctrl === 'pan' ? 'grab' : (ICHART.ctrl === 'zoom' ? 'zoom-in' : 'crosshair');
      ichartRender(wrap);
    });
    svg.addEventListener('wheel', function (e) {
      e.preventDefault();
      ichartZoomBy(wrap, e.deltaY > 0 ? 1.35 : 1 / 1.35);
    }, { passive: false });
    svg.addEventListener('dblclick', function (e) { e.preventDefault(); ichartReset(wrap); });
    svg.addEventListener('contextmenu', function (e) { e.preventDefault(); ichartReset(wrap); });
    /* 触摸：双指缩放（移动端评审用） */
    let pinch = null;
    svg.addEventListener('touchstart', function (e) {
      if (e.touches.length === 2) {
        pinch = { d: Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY) };
      }
    }, { passive: true });
    svg.addEventListener('touchmove', function (e) {
      if (e.touches.length === 2 && pinch) {
        const d2 = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        ichartZoomBy(wrap, (pinch.d / (d2 || 1)));
        pinch.d = d2;
        e.preventDefault();
      }
    }, { passive: false });
  });
}
/* 控制条：放大 / 缩小 / 复位 / 切换操作模式 */
document.addEventListener('click', function (e) {

  const wrap = box.querySelector('[data-ichart]');

  if (act === 'zoomIn') return ichartZoomBy(wrap, 1 / 1.6);

    ICHART.ctrl = b.dataset.mode;
    const svg = wrap.querySelector('svg.ichart');

function toast(msg, type) {

  el.textContent = msg;

}
function closeModal() { $('#modal-root').innerHTML = ''; }

/* 分页器 */
function pager(key, total, page, size, onGo) {
  const pages = Math.max(1, Math.ceil(total / size));
  window.__pagerHandlers = window.__pagerHandlers || {};
  window.__pagerHandlers[key] = onGo;
  let btns = '';
  const btn = p => '<button class="pg-btn' + (p === page ? ' active' : '') + '" data-pager="' + key + '" data-page="' + p + '">' + p + '</button>';
  if (pages <= 7) { for (let p = 1; p <= pages; p++) btns += btn(p); }
  else {
    btns += btn(1);
    if (page > 3) btns += '<span>…</span>';
    for (let p = Math.max(2, page - 1); p <= Math.min(pages - 1, page + 1); p++) btns += btn(p);
    if (page < pages - 2) btns += '<span>…</span>';
    btns += btn(pages);
  }
  return '<div class="pager"><span>共 <b>' + total + '</b> 条</span>' +
    '<select class="sel" data-pagesize="' + key + '" style="min-width:88px">' +
      [20, 50, 100].map(n => '<option value="' + n + '"' + (n === size ? ' selected' : '') + '>每页 ' + n + ' 条</option>').join('') +
    '</select>' +
    '<span class="spacer"></span>' +
    '<button class="pg-btn" data-pager="' + key + '" data-page="' + Math.max(1, page - 1) + '"' + (page === 1 ? ' disabled' : '') + '>上一页</button>' +
    btns +
    '<button class="pg-btn" data-pager="' + key + '" data-page="' + Math.min(pages, page + 1) + '"' + (page === pages ? ' disabled' : '') + '>下一页</button>' +
  '</div>';
}
document.addEventListener('click', e => {

/* ---- 历史销量序列（近 N 周，确定性生成） ---- */
function histSeries(sku, wh, weeks) {
  const out = [];
  for (let i = weeks - 1; i >= 0; i--) {
    const d = addDays(WEEK0, -i * 7);
    const raw = sku.base * WH_WEIGHT[wh] * 7 * seasonFactor(sku, d);
    const noise = 1 + Math.sin(i * 1.7 + sku.phase) * sku.cv * 0.42 + Math.cos(i * 0.9) * sku.cv * 0.2;
    out.push({ label: fmtDate(d).slice(5), value: Math.max(1, Math.round(raw * noise)) });
  }
  return out;
}
/* ---- 可信度 5 因子评分（销量预测 SRS 2.4.2 / 2.4.3）
       权重：历史数据量 20% · 数据稳定性 25% · 模型拟合度 25% · 预测周期 15% · 品类一致性 15% ---- */
function confFactors(sku) {
  const cl = v => Math.max(10, Math.min(100, Math.round(v)));
  return [
    { label:'历史数据量', value: cl(sku.conf + 6),       weight:20 },
    { label:'数据稳定性', value: cl(100 - sku.cv * 100), weight:25 },
    { label:'模型拟合度', value: cl(sku.r2 * 100),       weight:25 },
    { label:'预测周期',   value: cl(sku.conf + 9),       weight:15 },
    { label:'品类一致性', value: cl(sku.conf - 4),       weight:15 }
  ];
}
function confScore(sku) {
  const fs = confFactors(sku);
  return Math.round(fs.reduce((a, f) => a + f.value * f.weight / 100, 0));
}

/* —— Tab 1：预测结果（第一层输出明细） —— */
function fcTabPrediction() {
  const f = STATE.filters.fc = STATE.filters.fc || { name:'', wh:'', cls:'', conf:'', adj:'', status:'', horizon:'4' };
  const limit = Number(f.horizon) || 4;
  const skuHit = function (s) { return !f.name || s.code.indexOf(f.name) >= 0 || s.name.indexOf(f.name) >= 0; };
  const rows = FORECAST.filter(function (r) {
    if (r.w >= limit) return false;
    const s = skuBy(r.sku);
    return skuHit(s) && (!f.wh || r.wh === f.wh) && (!f.cls || abcXyz(s) === f.cls) &&
      (!f.conf || confLevel(confScore(s)) === f.conf) && (!f.status || r.status === f.status) &&
      (!f.adj || (f.adj === '已调整' ? r.adj !== 0 : r.adj === 0));
  }).sort(function (a, b) { return (a.w - b.w) || a.sku.localeCompare(b.sku); });
  const size = STATE.page.fcSize || 20;
  const page = Math.min(STATE.page.fc || 1, Math.max(1, Math.ceil(rows.length / size)));
  const view = rows.slice((page - 1) * size, page * size);
  const clsOpts = MODEL_MATCH.map(function (m) { return m.cls; });
  const trendSum = rows.reduce(function (a, b) { return a + b.ai; }, 0);
  const adjSum   = rows.reduce(function (a, b) { return a + b.adj; }, 0);
  const lowConfSku = {};
  rows.forEach(function (r) { if (confScore(skuBy(r.sku)) < 60) lowConfSku[r.sku] = 1; });

  return '<div class="formula">第一层输出：预测销量 = 模型预测值（只读）\n' +
      '调整后预测 = 第一层预测销量 + 第二层业务调整值　·　预测周期：未来 ' + limit + ' 周\n' +
      '可信度 &lt; ' + MODEL_PARAMS.confThreshold + ' 分时建议人工审核，可直接跳转「业务调整」录入第二层调整值</div>' +

    '<div class="kpi-grid">' +
      kpiCard({ label:'预测记录数', value: nf(rows.length), unit:'条', foot:'SKU × 仓库 × 周' }) +
      kpiCard({ label:'第一层预测合计', value: nf(trendSum), unit:'件', foot:'AI 自动生成，只读' }) +
      kpiCard({ label:'第二层调整合计', value: (adjSum > 0 ? '+' : '') + nf(adjSum), unit:'件', foot:'运营录入', tone: adjSum >= 0 ? 'k-good' : 'k-warn' }) +
      kpiCard({ label:'低可信 SKU', value: Object.keys(lowConfSku).length, unit:'个', foot:'可信度 < 60 分，建议人工审核', tone: Object.keys(lowConfSku).length ? 'k-warn' : 'k-good' }) +
    '</div>' +

    '<div class="card"><div class="filter-bar">' +
      '<div class="field"><label>SKU编号/名称</label><input class="inp wide" id="f-fc-name" value="' + esc(f.name) + '" placeholder="支持模糊搜索" /></div>' +
      '<div class="field"><label>仓库</label><select class="sel" id="f-fc-wh"><option value="">全部</option>' +
        WAREHOUSES.map(function (w) { return '<option value="' + w.code + '"' + (f.wh === w.code ? ' selected' : '') + '>' + esc(w.name) + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label>ABC-XYZ 分类</label><select class="sel" id="f-fc-cls"><option value="">全部</option>' +
        clsOpts.map(function (o) { return '<option' + (f.cls === o ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label>可信度</label><select class="sel" id="f-fc-conf"><option value="">全部</option>' +
        ['高可信', '中可信', '低可信', '不可信'].map(function (o) { return '<option' + (f.conf === o ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label>调整状态</label><select class="sel" id="f-fc-adj"><option value="">全部</option>' +
        ['已调整', '未调整'].map(function (o) { return '<option' + (f.adj === o ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label>提交状态</label><select class="sel" id="f-fc-status"><option value="">全部</option>' +
        ['待提交', '已提交', '已锁定'].map(function (o) { return '<option' + (f.status === o ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label>预测周期</label><select class="sel" id="f-fc-horizon">' +
        [['4', '未来 4 周'], ['8', '未来 8 周'], ['20', '未来 20 周']].map(function (o) {
          return '<option value="' + o[0] + '"' + (f.horizon === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
        }).join('') + '</select></div>' +
      '<div class="filter-actions"><button class="btn primary" data-act="fc-search">搜索</button>' +
        '<button class="btn" data-act="fc-reset">重置</button></div>' +
    '</div>' +
    '<div class="card-body tight"><div class="table-wrap"><table class="tbl">' +
      '<thead><tr><th>可信度</th><th>分类</th><th>SKU编号</th><th>SKU名称</th><th>仓库</th><th>预测周</th>' +
      '<th>走势</th>' +
      '<th class="num">第一层：预测销量</th><th class="num">置信下限</th><th class="num">置信上限</th>' +
      '<th class="num">第二层：调整值</th><th class="num">调整后预测</th><th>提交状态</th><th>预测来源</th><th>操作</th></tr></thead><tbody>' +
      (view.length ? view.map(function (r) {
        const s = skuBy(r.sku), score = confScore(s);
        return '<tr><td>' + confCell(score) + '</td><td>' + abcCell(s) + '</td>' +
          '<td class="mono">' + r.sku + '</td><td>' + esc(s.name) + '</td><td>' + esc(whBy(r.wh).name) + '</td>' +
          '<td class="mono">' + r.week + '</td>' +
          /* 走势缩略图：近 12 周实际（实线）+ 未来 4 周预测（虚线），点击等同「查看预测」 */
          '<td class="spark-cell" data-act="fc-detail" data-sku="' + r.sku + '" data-wh="' + r.wh + '" title="' +
            esc(s.name) + ' · ' + esc(whBy(r.wh).name) + '　点击查看放大走势">' + sparkSvg(r.sku, r.wh) + '</td>' +
          '<td class="num strong">' + nf(r.ai) + '</td>' +
          '<td class="num inline-note">' + nf(r.lower) + '</td><td class="num inline-note">' + nf(r.upper) + '</td>' +
          '<td class="num" style="color:' + (r.adj > 0 ? 'var(--green)' : r.adj < 0 ? 'var(--red)' : 'inherit') + '">' + (r.adj > 0 ? '+' : '') + nf(r.adj) + '</td>' +
          '<td class="num strong">' + nf(r.ai + r.adj) + '</td>' +
          '<td>' + st(r.status) + '</td><td>' + st(r.source) + '</td>' +
          '<td><button class="link-btn" data-act="fc-detail" data-sku="' + r.sku + '" data-wh="' + r.wh + '">查看预测</button></td></tr>';
      }).join('') : emptyRow(15, '没有匹配的预测结果')) +
    '</tbody></table></div>' + pager('fc', rows.length, page, size, function (p, sz) {
      STATE.page.fc = p; if (sz) STATE.page.fcSize = sz; render();
    }) + '</div></div>';
}

/* —— Tab 2：数据清洗（SRS 2.1 / 2.2） —— */
function fcTabClean() {
  const total = CLEAN_STATS.reduce(function (a, b) { return a + b.hit; }, 0);
  const collected = SKUS.length * SHOPS.length * 365;
  const passRate = ((1 - total / collected) * 100).toFixed(2);

  return '<div class="notice">' + icon('info', 'width:15px;height:15px') +
      '<div><b>数据规格</b>：历史数据范围默认过去 365 天（支持自定义配置）；预测时间范围未来 20 周；数据颗粒度以「周」为主（服装行业推荐，可减少日间波动噪声）；维度层级为 渠道 → 国家 → 店铺 → SKU。</div></div>' +

    '<div class="kpi-grid">' +
      kpiCard({ label:'采集记录数', value: nf(collected), unit:'条', foot:'日颗粒 · 渠道+国家+店铺+SKU' }) +
      kpiCard({ label:'清洗命中', value: nf(total), unit:'条', foot:'去重 / 异常值 / 连续异常 / 边界截断 / 缺失填充' }) +
      kpiCard({ label:'非活跃 SKU', value: INACTIVE_SKUS.length, unit:'个', foot:'连续 30 天无销量，预测值置零', tone: INACTIVE_SKUS.length ? 'k-warn' : 'k-good' }) +
      kpiCard({ label:'清洗通过率', value: passRate + '%', unit:'', foot:'清洗后进入模型训练', tone:'k-good' }) +
    '</div>' +

    '<div class="grid-2">' +
      '<div class="card"><div class="card-head"><h3>清洗规则</h3><span class="spacer"></span><span class="hint">SRS 2.2.1</span></div>' +
        '<div class="card-body tight"><div class="table-wrap"><table class="tbl">' +
        '<thead><tr><th>清洗类型</th><th>规则说明</th><th class="num">命中</th></tr></thead><tbody>' +
        CLEAN_STATS.map(function (r) {
          return '<tr><td>' + badge(r.rule, r.tone) + '</td><td class="inline-note">' + esc(r.sub) + '</td>' +
            '<td class="num strong">' + nf(r.hit) + '</td></tr>';
        }).join('') + '</tbody></table></div></div></div>' +

      '<div class="card"><div class="card-head"><h3>数据质量检查</h3><span class="spacer"></span><span class="hint">SRS 2.2.3</span></div>' +
        '<div class="card-body tight"><div class="table-wrap"><table class="tbl">' +
        '<thead><tr><th>检查项</th><th>阈值</th><th>处理方式</th></tr></thead><tbody>' +
        QUALITY_CHECKS.map(function (r) {
          return '<tr><td>' + esc(r.item) + '</td><td class="mono inline-note">' + esc(r.threshold) + '</td>' +
            '<td class="inline-note">' + esc(r.act) + '</td></tr>';
        }).join('') + '</tbody></table></div></div></div>' +
    '</div>' +

    '<div class="card"><div class="card-head"><h3>非活跃 SKU</h3>' +
      '<span class="spacer"></span><span class="hint">判定条件：连续 30 天无销量（可配置）→ 标记为非活跃，预测值置零</span></div>' +
      '<div class="card-body tight"><div class="table-wrap"><table class="tbl">' +
      '<thead><tr><th>SKU编号</th><th>SKU名称</th><th>分类</th><th class="num">连续零销量</th><th>最后销售日期</th><th>处理</th></tr></thead><tbody>' +

/* —— Tab 3：模型选择（SRS 2.3） —— */
function fcTabModel() {
  const abc = [
    ['A 类', '累计销量占比前 80%',  '核心主力 SKU，高贡献', '优先使用复杂模型（LSTM / Prophet），配置高可信度要求', 'blue'],
    ['B 类', '累计销量占比 80%-95%', '中等贡献 SKU',        '使用 ARIMA 或规则预测，定期复核',                    'teal'],
    ['C 类', '累计销量占比后 5%',   '长尾 SKU，低贡献',     '以规则预测为主，降低计算资源消耗',                    'gray']
  ];
  const xyz = [
    ['X 类', 'CV < 0.2',      '需求非常稳定，可预测性高',        '可信任度高，置信区间窄',              'green'],
    ['Y 类', 'CV 0.2 - 0.5',  '需求有一定波动，但可预测',        '可信任度中等，置信区间适中',          'orange'],
    ['Z 类', 'CV > 0.5',      '需求极不稳定，难以预测',          '可信任度低，置信区间宽，建议人工审核', 'red']
  ];
  const gridCell = function (cls) {
    const g = ABC_XYZ_GRID.find(function (x) { return x.cls === cls; });
    const n = SKUS.filter(function (s) { return abcXyz(s) === cls; }).length;
    return '<td style="text-align:center;padding:9px 6px">' + badge(cls, g.tone) +
      '<div class="inline-note" style="margin-top:5px">' + g.star + ' ' + esc(g.act) + '</div>' +
      '<div class="inline-note">' + n + ' 个 SKU</div></td>';
  };

  return '<div class="notice">' + icon('info', 'width:15px;height:15px') +
      '<div><b>模型自动匹配</b>：系统根据 SKU 的 ABC-XYZ 分类自动匹配最佳预测模型。ABC 分类每月按滚动 12 个月销量数据重算一次。</div></div>' +

    '<div class="formula">变异系数（CV）= 标准差 / 均值</div>' +

    '<div class="grid-2">' +
      '<div class="card"><div class="card-head"><h3>ABC 分类（销量贡献度）</h3><span class="spacer"></span><span class="hint">帕累托法则</span></div>' +
        '<div class="card-body tight"><div class="table-wrap"><table class="tbl">' +
        '<thead><tr><th>分类</th><th>划分标准</th><th>定义</th><th>预测策略</th></tr></thead><tbody>' +
        abc.map(function (r) {
          return '<tr><td>' + badge(r[0], r[4]) + '</td><td class="inline-note">' + esc(r[1]) + '</td>' +
            '<td>' + esc(r[2]) + '</td><td class="inline-note">' + esc(r[3]) + '</td></tr>';
        }).join('') + '</tbody></table></div></div></div>' +

      '<div class="card"><div class="card-head"><h3>XYZ 分类（需求稳定性）</h3><span class="spacer"></span><span class="hint">基于 CV</span></div>' +
        '<div class="card-body tight"><div class="table-wrap"><table class="tbl">' +
        '<thead><tr><th>分类</th><th>划分标准</th><th>定义</th><th>预测策略</th></tr></thead><tbody>' +

/* —— Tab 4：可信度评估（SRS 2.4） —— */
function fcTabConfidence() {
  const levels = [
    ['高可信', '80-100 分', '预测结果可靠，可直接使用',   '建议直接采纳',              'green'],
    ['中可信', '60-79 分',  '预测结果基本可靠，需关注波动', '建议参考，适当审核',        'orange'],
    ['低可信', '40-59 分',  '预测存在较大不确定性',       '建议人工审核',              'red'],
    ['不可信', '< 40 分',   '预测结果不可靠',             '建议使用规则预测或人工判断', 'gray']
  ];
  const dist = {};
  SKUS.forEach(function (s) { const l = confLevel(confScore(s)); dist[l] = (dist[l] || 0) + 1; });
  const donutItems = ['高可信', '中可信', '低可信', '不可信'].map(function (l) {
    return { label:l, value: dist[l] || 0, color: { '高可信':'#2b7a4f', '中可信':'#ab6d12', '低可信':'#c33f2b', '不可信':'#6b7683' }[l] };
  });
  const sorted = SKUS.slice().sort(function (a, b) { return confScore(a) - confScore(b); });

  return '<div class="notice">' + icon('info', 'width:15px;height:15px') +
      '<div>系统为每条预测结果计算可信度评分，帮助用户判断预测结果的可信赖程度；评分由 <b>5 个因子加权</b>计算，低于 ' +
      MODEL_PARAMS.confThreshold + ' 分建议人工审核。</div></div>' +

    '<div class="formula">可信度评分 =\n' +
      '  历史数据量因子(0-100) × 20%\n' +
      '+ 数据稳定性因子(0-100) × 25%\n' +
      '+ 模型拟合度因子(0-100) × 25%\n' +
      '+ 预测周期因子(0-100) × 15%\n' +
      '+ 品类一致性因子(0-100) × 15%</div>' +

    '<div class="kpi-grid">' +
      ['高可信', '中可信', '低可信', '不可信'].map(function (l) {
        const tone = { '高可信':'k-good', '中可信':'k-warn', '低可信':'k-danger', '不可信':'' }[l];
        return kpiCard({ label:l, value:(dist[l] || 0), unit:'个 SKU',
          foot: (SKUS.length ? ((dist[l] || 0) / SKUS.length * 100).toFixed(1) : 0) + '% 占比', tone:tone });
      }).join('') +
    '</div>' +

    '<div class="grid-2">' +
      '<div class="card"><div class="card-head"><h3>可信度评分体系</h3><span class="spacer"></span><span class="hint">SRS 2.4.1</span></div>' +
        '<div class="card-body tight"><div class="table-wrap"><table class="tbl">' +
        '<thead><tr><th>评分等级</th><th>分数范围</th><th>含义</th><th>补货建议</th></tr></thead><tbody>' +
        levels.map(function (r) {
          return '<tr><td>' + badge(r[0], r[4]) + '</td><td class="mono inline-note">' + esc(r[1]) + '</td>' +
            '<td>' + esc(r[2]) + '</td><td class="inline-note">' + esc(r[3]) + '</td></tr>';
        }).join('') + '</tbody></table></div></div></div>' +

      '<div class="card"><div class="card-head"><h3>可信度计算因子</h3><span class="spacer"></span><span class="hint">权重合计 100%</span></div>' +
        '<div class="card-body">' + chartBars(CONF_WEIGHTS.map(function (w) {
          return { label: w.f, value: w.w, color:'#4a6fa5' };
        }), { height:190 }) +
        '<div class="chart-legend">' + CONF_WEIGHTS.map(function (w) {
          return '<span><i class="swatch" style="background:#4a6fa5"></i>' + esc(w.f) + ' ' + w.w + '% · ' + esc(w.desc) + '</span>';
        }).join('') + '</div></div></div>' +
    '</div>' +

    '<div class="split">' +
      '<div class="card"><div class="card-head"><h3>SKU 可信度分布</h3><span class="spacer"></span><span class="hint">共 ' + SKUS.length + ' 个 SKU</span></div>' +
        '<div class="card-body tight"><div class="table-wrap"><table class="tbl">' +
        '<thead><tr><th>可信度</th><th>分类</th><th>SKU编号</th><th>SKU名称</th><th class="num">CV</th>' +
        '<th class="num">R²</th><th>预测模型</th><th class="num">评分</th><th>建议动作</th></tr></thead><tbody>' +
        sorted.map(function (s) {
          const score = confScore(s), lv = confLevel(score);
          const act = score >= 80 ? '直接采纳' : (score >= 60 ? '参考并适当审核' : (score >= 40 ? '人工审核' : '规则预测 / 人工判断'));
          return '<tr><td>' + badge(lv, confTone(score)) + '</td><td>' + abcCell(s) + '</td>' +
            '<td class="mono">' + s.code + '</td><td>' + esc(s.name) + '</td>' +
            '<td class="num inline-note">' + s.cv.toFixed(2) + '</td>' +
            '<td class="num inline-note">' + s.r2.toFixed(3) + '</td>' +
            '<td class="inline-note">' + esc(s.model) + '</td>' +
            '<td class="num">' + confCell(score) + '</td>' +
            '<td class="inline-note">' + esc(act) + '</td></tr>';
        }).join('') + '</tbody></table></div></div></div>' +

      '<div class="card"><div class="card-head"><h3>因子得分说明</h3></div><div class="card-body">' +
        '<div class="sec-title">高可信预测的典型特征</div>' +
        '<div class="step-list">' +
          ['AX 类 SKU：高贡献 + 高稳定性',
           '历史数据 > 2 年：数据量充足，季节性可分析',
           'CV < 0.2：需求非常稳定',
           '短期预测（7 天内）：预测周期短，不确定性低',
           '模型 R² > 0.85：模型拟合度良好'].map(function (t) {
            return '<div><span class="tick">·</span><span>' + esc(t) + '</span></div>';
          }).join('') + '</div>' +
        '<div class="sec-title">低可信预警的典型特征</div>' +
        '<div class="step-list">' +
          ['新品 SKU：无历史数据，冷启动阶段',
           'CZ 类 SKU：低贡献 + 低稳定性',
           'CV > 0.8：需求极度不稳定',
           '长期预测（90 天+）：不确定性随周期延长增加',
           '模型 R² < 0.5：模型拟合度差'].map(function (t) {
            return '<div><span class="tick" style="color:var(--orange)">·</span><span>' + esc(t) + '</span></div>';
          }).join('') + '</div>' +
      '</div></div>' +
    '</div>';
}

function viewSafety() {
  const f = STATE.filters.safety = STATE.filters.safety || { name:'', wh:'', urgent:'' };

    const s = skuBy(i.sku);
    let urgent = '充足';
    if (i.sellDays < s.safetyDays * 0.5) urgent = '紧急';
    else if (i.sellDays < s.safetyDays) urgent = '正常';
    return (!f.name || i.sku.indexOf(f.name) >= 0 || s.name.indexOf(f.name) >= 0) &&
      (!f.wh || i.wh === f.wh) && (!f.urgent || urgent === f.urgent);

  const size = STATE.page.safetySize || 20;
  const page = Math.min(STATE.page.safety || 1, Math.max(1, Math.ceil(rows.length / size)));

function viewSuggestion() {
  const f = STATE.filters.sug = STATE.filters.sug || { name:'', wh:'', mode:'', urgent:'', status:'', sup:'' };
  /* 默认排序：紧急优先，其次按建议补货量降序，让需要立即处理的记录排在最前 */
  const URGENT_RANK = { '紧急':0, '正常':1, '充足':2 };
  let rows = SUGGESTIONS.filter(s => {
    const sku = skuBy(s.sku);
    return (!f.name || s.sku.indexOf(f.name) >= 0 || sku.name.indexOf(f.name) >= 0) &&
      (!f.wh || s.wh === f.wh) && (!f.mode || s.mode === f.mode) && (!f.urgent || s.urgent === f.urgent) &&
      (!f.status || s.status === f.status) && (!f.sup || s.sup === f.sup);
  }).sort((a, b) => (URGENT_RANK[a.urgent] - URGENT_RANK[b.urgent]) || (b.qtyFinal - a.qtyFinal));
  const size = STATE.page.sugSize || 20;
  const page = Math.min(STATE.page.sug || 1, Math.max(1, Math.ceil(rows.length / size)));
  const view = rows.slice((page - 1) * size, page * size);
  const editable = canEdit('suggestion');
  const stat = n => SUGGESTIONS.filter(s => s.status === n).length;

  return pageHead('补货建议', '系统综合目标库存、当前库存、在途库存与采购周期内预测销量自动计算，并标注执行方式',

    kpiCard({ label:'紧急补货', value: SUGGESTIONS.filter(s => s.urgent === '紧急').length, unit:'条', foot:'预计可售天数 < 安全库存 50%', tone:'k-danger' }) +

  '审核通过后自动分发：采购 → 生成采购订单并推送 ERP；调拨 → 生成调拨单</div>' +

const STOCK_SEV = { '库存为负':0, '过期':1, '预警':2, '呆滞':3, '正常':4 };
const AGING_BINS = [
  { key:'0-30',  label:'0-30 天',   note:'新入库库存' },
  { key:'31-60', label:'31-60 天',  note:'正常库龄' },
  { key:'61-90', label:'61-90 天',  note:'需关注' },
  { key:'90+',   label:'90 天以上', note:'呆滞风险' }
];
const AGING_COLORS = { '0-30':'#2b7a4f', '31-60':'#1b5fa8', '61-90':'#ab6d12', '90+':'#c33f2b' };
function agingBinOf(d) { return d <= 30 ? '0-30' : (d <= 60 ? '31-60' : (d <= 90 ? '61-90' : '90+')); }

/* ---------------- 库存查询 ---------------- */
function viewStockQuery() {
  const f = STATE.filters.stock = STATE.filters.stock || { name:'', wh:'', status:'', has:'全部', alert:'' };

    const s = skuBy(i.sku), stt = invStatusOf(i);
    return (!f.name || i.sku.indexOf(f.name) >= 0 || s.name.indexOf(f.name) >= 0) &&
      (!f.wh || i.wh === f.wh) && (!f.status || stt === f.status) &&
      (!f.has || f.has === '全部' || f.has === (i.qty > 0 ? '是' : '否')) &&
      (!f.alert || alertTypeOf(i) === f.alert);
  }).sort((a, b) => (STOCK_SEV[invStatusOf(a)] - STOCK_SEV[invStatusOf(b)]) || a.sku.localeCompare(b.sku));
  const size = STATE.page.stockSize || 20;
  const page = Math.min(STATE.page.stock || 1, Math.max(1, Math.ceil(rows.length / size)));
  const view = rows.slice((page - 1) * size, page * size);
  const sum = k => rows.reduce((a, b) => a + b[k], 0);
  const neg = rows.filter(i => i.qty < 0);
  const stale = rows.filter(i => i.stale);

  return pageHead('库存查询', '在库 / 可用 / 预留 / 在途 / 在制 五维度库存快照 · 来源 ERP 实时同步，支持手动刷新',

  ((neg.length || stale.length) ?
    '<div class="notice ' + (neg.length ? 'danger' : 'warn') + '">' + icon('warn', 'width:15px;height:15px') + '<div>' +
      (neg.length ? '<b>' + neg.length + ' 条库存数据为负</b>（' + neg.map(i => i.sku + ' / ' + whBy(i.wh).name).join('；') + '），已红色高亮，请联系管理员处理。' : '') +
      (stale.length ? (neg.length ? '<br/>' : '') + '<b>' + stale.length + ' 条数据超过 24 小时未更新</b>（' +
        stale.map(i => i.sku + ' / ' + whBy(i.wh).name).join('；') + '），请检查 ERP 数据同步。' : '') +
    '</div></div>' : '') +

  '<div class="kpi-grid">' +
    kpiCard({ label:'在库库存', value: nf(sum('qty')), unit:'件', foot:'当前筛选范围内的实际在库' }) +
    kpiCard({ label:'可用库存', value: nf(sum('available')), unit:'件', foot:'在库 − 预留库存', tone:'k-good' }) +
    kpiCard({ label:'预留库存', value: nf(sum('reserved')), unit:'件', foot:'已分配给订单、尚未出库', tone:'k-warn' }) +
    kpiCard({ label:'在途 + 在制', value: nf(sum('inTransit') + sum('inProduction')), unit:'件', foot:'在途 ' + nf(sum('inTransit')) + ' · 在制 ' + nf(sum('inProduction')) }) +
  '</div>' +

  '<div class="card"><div class="filter-bar">' +
    '<div class="field"><label>SKU编号/名称</label><input class="inp wide" id="f-stk-name" value="' + esc(f.name) + '" placeholder="支持模糊搜索" /></div>' +
    '<div class="field"><label>仓库</label><select class="sel" id="f-stk-wh"><option value="">全部</option>' +
      WAREHOUSES.map(w => '<option value="' + w.code + '"' + (f.wh === w.code ? ' selected' : '') + '>' + esc(w.name) + '</option>').join('') + '</select></div>' +
    '<div class="field"><label>库存状态</label><select class="sel" id="f-stk-status"><option value="">全部</option>' +
      ['正常', '预警', '呆滞', '过期'].map(o => '<option' + (f.status === o ? ' selected' : '') + '>' + o + '</option>').join('') + '</select></div>' +
    '<div class="field"><label>有库存</label><select class="sel" id="f-stk-has">' +
      ['全部', '是', '否'].map(o => '<option' + (f.has === o ? ' selected' : '') + '>' + o + '</option>').join('') + '</select></div>' +
    '<div class="field"><label>库存预警类型</label><select class="sel" id="f-stk-alert"><option value="">全部</option>' +
      ALERT_TYPES.map(o => '<option' + (f.alert === o ? ' selected' : '') + '>' + o + '</option>').join('') + '</select></div>' +
    '<div class="filter-actions"><button class="btn primary" data-act="stock-search">搜索</button>' +
      '<button class="btn" data-act="stock-reset">重置</button></div>' +
  '</div>' +
  '<div class="card-body tight"><div class="table-wrap"><table class="tbl">' +
    '<thead><tr><th>仓库</th><th>SKU编号</th><th>SKU名称</th>' +
    '<th class="num">在库库存</th><th class="num">可用库存</th><th class="num">预留库存</th>' +
    '<th class="num">在途库存</th><th class="num">在制库存</th><th class="num">总库存</th>' +
    '<th>库存状态</th><th>最后更新</th><th>操作</th></tr></thead><tbody>' +
    (view.length ? view.map(i => {
      const s = skuBy(i.sku), stt = invStatusOf(i), bad = i.qty < 0;
      return '<tr class="' + (bad ? 'row-danger' : '') + '">' +
        '<td>' + whTag(i.wh) + '</td><td class="mono">' + i.sku + '</td><td>' + esc(s.name) + '</td>' +
        '<td class="num strong"' + (bad ? ' style="color:var(--red)"' : '') + '>' + nf(i.qty) + '</td>' +
        '<td class="num"' + (i.available < i.safety ? ' style="color:var(--orange)"' : '') + '>' + nf(i.available) + '</td>' +
        '<td class="num">' + nf(i.reserved) + '</td>' +
        '<td class="num">' + nf(i.inTransit) + '</td><td class="num">' + nf(i.inProduction) + '</td>' +
        '<td class="num strong">' + nf(i.total) + '</td>' +
        '<td>' + invSt(stt) + '</td>' +
        '<td class="mono inline-note">' + esc(i.lastUpdate) + (i.stale ? ' <span style="color:var(--red)">超24h</span>' : '') + '</td>' +
        '<td><button class="link-btn" data-act="stock-detail" data-sku="' + i.sku + '" data-wh="' + i.wh + '">查看详情</button></td></tr>';
    }).join('') : emptyRow(12, '暂无库存数据，请检查 ERP 数据同步状态')) +
  '</tbody></table></div>' + pager('stock', rows.length, page, size, (p, sz) => { STATE.page.stock = p; if (sz) STATE.page.stockSize = sz; render(); }) + '</div></div>';
}

/* ---------------- 库存分析 ---------------- */
function viewStockAnalysis() {
  const f = STATE.filters.stockAna = STATE.filters.stockAna || { wh:'', cate:'', dim:'周转天数' };
  const dim = f.dim || '周转天数';
  const CATES = Array.from(new Set(SKUS.map(s => s.cate.split('-')[0])));
  const rows = INVENTORY.filter(i => {
    const s = skuBy(i.sku);
    return (!f.wh || i.wh === f.wh) && (!f.cate || s.cate.indexOf(f.cate) === 0);
  });
  const qty    = rows.reduce((a, b) => a + b.qty, 0);
  const daily  = rows.reduce((a, b) => a + b.daily, 0) || 1;
  const turnDays  = Math.round(qty / daily);
  const avgInv    = Math.round((qty * 1.06 + qty) / 2);
  const outQty30  = Math.round(daily * 30);
  const turnTimes = +(outQty30 / (avgInv || 1)).toFixed(2);

  /* 分类维度周转对比 */
  const catTurn = CATES.map(c => {
    const rs = rows.filter(i => skuBy(i.sku).cate.indexOf(c) === 0);
    const q = rs.reduce((a, b) => a + b.qty, 0), d = rs.reduce((a, b) => a + b.daily, 0) || 1;
    return { label: c, value: Math.round(q / d), color: PALETTE[CATES.indexOf(c) % PALETTE.length], _q: q };
  }).filter(x => x._q > 0).sort((a, b) => b.value - a.value);

  /* 库龄结构 */
  const aging = AGING_BINS.map(b => {
    const rs = INVENTORY.filter(i => agingBinOf(i.ageDays) === b.key && (!f.wh || i.wh === f.wh) &&
      (!f.cate || skuBy(i.sku).cate.indexOf(f.cate) === 0));
    return { key:b.key, label:b.label, note:b.note, qty: rs.reduce((a, x) => a + x.qty, 0), color: AGING_COLORS[b.key] };
  });
  const agingTotal = aging.reduce((a, b) => a + b.qty, 0) || 1;

  /* 呆滞清单 */
  const idle = INVENTORY.filter(i => i.idleDays > 60 && (!f.wh || i.wh === f.wh) &&
    (!f.cate || skuBy(i.sku).cate.indexOf(f.cate) === 0)).sort((a, b) => b.idleDays - a.idleDays);
  const idleLevel = d => d <= 90 ? '轻度' : (d <= 180 ? '中度' : '重度');
  const idleTone  = d => d <= 90 ? 'orange' : (d <= 180 ? 'red' : 'violet');
  const idleAdvice = d => d <= 90 ? '转入促销活动，加速周转' : (d <= 180 ? '折扣清仓 / 转次级渠道消化' : '计提减值，评估报废或尾货处理');

  const dimBody =
    dim === '周转天数' ?
      '<div class="kpi-grid">' +
        kpiCard({ label:'库存周转天数', value: turnDays, unit:'天', foot:'总库存 ÷ 日均销量 · 跨境基线 60-90 天', tone: turnDays > 90 ? 'k-danger' : 'k-warn' }) +
        kpiCard({ label:'库存周转次数', value: turnTimes, unit:'次/月', foot:'期内出库总量 ÷ 平均库存' }) +
        kpiCard({ label:'平均库存', value: nf(avgInv), unit:'件', foot:'（期初 + 期末）÷ 2' }) +
        kpiCard({ label:'90 天以上库存占比', value: pct(aging[3].qty / agingTotal), foot:'库龄超 90 天，存在呆滞风险', tone:'k-danger' }) +
      '</div>' +
      '<div class="grid-2">' +
        '<div class="card"><div class="card-head"><h3>库存周转天数趋势</h3><span class="hint">近 30 天</span></div>' +
          '<div class="card-body">' +
            chartForecast({ labels: ACC_DAYS, actual: ACC_TREND.slice(-30).map((v, k) => Math.round(turnDays + Math.sin(k / 4.2) * 5 + (k - 15) * 0.18)), height: 214, zeroBase: false }) +
            '<div class="chart-legend"><span><i class="swatch" style="background:#1b5fa8"></i>周转天数</span>' +
            '<span class="inline-note">跨境行业基线 60-90 天</span></div>' +
          '</div></div>' +
        '<div class="card"><div class="card-head"><h3>分类周转对比</h3><span class="hint">单位：天</span></div>' +
          '<div class="card-body">' + chartBars(catTurn.map(c => ({ label:c.label, value:c.value, color:c.color })), { height:214 }) + '</div></div>' +
      '</div>' +
      '<div class="card"><div class="card-head"><h3>分类周转明细</h3><span class="hint">按品类汇总</span></div>' +
        '<div class="card-body tight"><div class="table-wrap"><table class="tbl">' +
        '<thead><tr><th>SKU分类</th><th class="num">在库库存</th><th class="num">日均销量</th><th class="num">周转天数</th><th>健康度</th></tr></thead><tbody>' +
        catTurn.map(c => '<tr><td>' + esc(c.label) + '</td><td class="num">' + nf(c._q) + '</td>' +
          '<td class="num">' + (c.value ? Math.round(c._q / c.value) : 0) + '</td>' +
          '<td class="num strong"' + (c.value > 90 ? ' style="color:var(--red)"' : '') + '>' + c.value + '</td>' +
          '<td>' + st(c.value <= 60 ? '充足' : (c.value <= 90 ? '正常' : '紧急')) + '</td></tr>').join('') +
        '</tbody></table></div></div></div>' :

    dim === '库龄分布' ?
      '<div class="card"><div class="card-head"><h3>库龄结构</h3><span class="hint">库龄自最近一次入库日期起算</span></div>' +
        '<div class="card-body">' +
          '<div class="stackbar">' + aging.map(b =>
            '<i style="width:' + ((b.qty / agingTotal) * 100).toFixed(1) + '%;background:' + b.color + '" title="' + esc(b.label) + '"></i>').join('') + '</div>' +
          '<div class="chart-legend" style="margin-top:10px">' + aging.map(b =>
            '<span><i class="swatch" style="background:' + b.color + '"></i>' + esc(b.label) + '</span>').join('') + '</div>' +
        '</div></div>' +
      '<div class="card"><div class="card-head"><h3>库龄分布明细</h3><span class="hint">共 ' + nf(agingTotal) + ' 件</span></div>' +
        '<div class="card-body tight"><div class="table-wrap"><table class="tbl">' +
        '<thead><tr><th>库龄区间</th><th class="num">库存量</th><th class="num">占比</th><th class="num">库存金额</th><th>说明</th></tr></thead><tbody>' +
        aging.map(b => {
          const amt = INVENTORY.filter(i => agingBinOf(i.ageDays) === b.key).reduce((a, x) => a + x.qty * x.cost, 0);
          return '<tr><td><span class="swatch" style="background:' + b.color + ';display:inline-block;margin-right:6px"></span>' + esc(b.label) + '</td>' +
            '<td class="num strong">' + nf(b.qty) + '</td><td class="num">' + pct(b.qty / agingTotal, 1) + '</td>' +
            '<td class="num">¥' + nf(amt) + '</td><td class="inline-note">' + esc(b.note) + '</td></tr>';
        }).join('') +
        '</tbody></table></div></div></div>' :
